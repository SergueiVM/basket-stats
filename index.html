<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estadísticas de baloncesto - registro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ea6a1f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baloncesto">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f5f7;--card:#fff;--text:#1c1c1e;--muted:#6b6b70;--line:#dcdce0;--accent:#ea6a1f;--btn:#fff4ec;--ok:#dff3e4;--okt:#1b6b32;--ko:#fbe3e3;--kot:#b3261e;--danger:#c62828;--riv:#2f6fed;--rivbg:#eaf0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1e1e22;--text:#f2f2f4;--muted:#9a9aa1;--line:#333338;--accent:#ff8a3d;--btn:#2b2119;--ok:#1d3325;--okt:#7fdc99;--ko:#3a1f1f;--kot:#f28b82;--danger:#ef6b6b;--riv:#5b8dff;--rivbg:#222d45}}
:root[data-theme="dark"]{--bg:#121214;--card:#1e1e22;--text:#f2f2f4;--muted:#9a9aa1;--line:#333338;--accent:#ff8a3d;--btn:#2b2119;--ok:#1d3325;--okt:#7fdc99;--ko:#3a1f1f;--kot:#f28b82;--danger:#ef6b6b;--riv:#5b8dff;--rivbg:#222d45}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{height:100%;height:100dvh;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:auto}
#app{min-height:100%;height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{flex-shrink:0;display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 8px}
h1{font-size:1rem;margin:0}
.bar{display:flex;gap:6px}
.tb{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:9px 11px;font-size:.8rem;cursor:pointer}
.tb.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb.dg{color:var(--danger)}
.perwrap{flex-shrink:0;margin:2px 8px 8px;padding:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.per{display:flex;gap:8px;overflow-x:auto}
.per button{flex:0 0 auto;min-width:50px;height:44px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;font-weight:800;font-size:.9rem;cursor:pointer;padding:0 12px}
.per button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.score{flex-shrink:0;margin:0 8px 10px;padding:10px 6px;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:16px}
.score .team{display:flex;flex-direction:column;align-items:center;min-width:78px}
.score .lbl{font-size:.64rem;color:var(--muted);text-transform:uppercase;font-weight:700;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .tag{font-size:.56rem;color:var(--accent);font-weight:700;height:11px}
.score .team.riv .tag{color:var(--riv)}
.score .val{font-size:2rem;font-weight:800;line-height:1.1}
.score .team.riv .val{color:var(--riv)}
.score .dash{font-size:1.5rem;color:var(--muted);font-weight:700}
.score .fouls{font-size:.6rem;color:var(--muted);margin-top:3px}
.score .team.riv .fouls{color:var(--riv)}
.actsA{flex-shrink:0;display:grid;gap:6px;padding:2px 8px 0}
.actsB{flex-shrink:0;display:grid;gap:6px;padding:6px 8px 0}
.a{height:66px;border:none;border-radius:13px;padding:0 4px;font-weight:700;font-size:.95rem;cursor:pointer;touch-action:manipulation;color:var(--text)}
.a.n{background:var(--btn)}
.a.m{background:var(--ok);color:var(--okt)}
.a.f{background:var(--ko);color:var(--kot)}
.a.sel{background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent);transform:scale(.96)}
.msg{flex-shrink:0;text-align:center;font-size:.82rem;padding:6px 8px;min-height:30px;color:var(--muted)}
.msg.sel{color:var(--accent);font-weight:700}
.msg.warn{color:var(--danger);font-weight:700}
.pkoverlay{position:fixed;inset:0;background:rgba(0,0,0,.52);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.pksheet{background:var(--card);width:100%;max-width:520px;border-radius:18px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto}
.pkhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:1.05rem;padding:6px 6px 12px}
.pkhead button{flex-shrink:0;border:none;background:none;color:var(--muted);font-size:1.4rem;padding:4px 8px;cursor:pointer;line-height:1}
.pktitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.pkbadge{font-weight:800;padding:5px 11px;border-radius:9px;font-size:.95rem;background:var(--btn);color:var(--text);white-space:nowrap}
.pkbadge.m{background:var(--ok);color:var(--okt)}
.pkbadge.f{background:var(--ko);color:var(--kot)}
.pksub{font-size:.78rem;color:var(--muted);font-weight:600}
.pkactlist{display:flex;flex-direction:column;gap:6px;padding:0 2px 8px}
.pkact{text-align:left;padding:13px 14px;border:none;border-radius:11px;font-weight:700;font-size:.9rem;cursor:pointer;background:var(--btn);color:var(--text)}
.pkact.m{background:var(--ok);color:var(--okt)}
.pkact.f{background:var(--ko);color:var(--kot)}
.pkact.selected{outline:3px solid var(--accent);outline-offset:1px}
.pksub2{font-weight:500;opacity:.8;font-size:.8rem}
.pl.pk{padding:0 2px 10px}
.pl.pk .p{height:74px}
.teams.pk{padding:0 2px 10px}
.pkextra{display:block;width:100%;min-height:58px;margin:0 2px;padding:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:13px;font-weight:700;font-size:1rem;cursor:pointer}
.pkextra.equipo{background:var(--accent);color:#fff;border-color:var(--accent)}
.pkextra.warn{background:var(--ko);color:var(--kot);border-color:transparent}
.bat{display:flex;gap:2px;margin-top:4px}
.bat i{width:8px;height:6px;border-radius:1.5px;background:var(--line);display:block;font-style:normal}
.bat i.on{background:var(--accent)}
.bat i.on.over{background:var(--danger)}
.pbat{display:flex;gap:2px;margin-left:4px}
.pbat i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.pbat i.on{background:var(--accent)}
.pbat i.on.over{background:var(--danger)}
.roster{flex-shrink:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:7px;padding:0 8px 8px;pointer-events:none}
.p.ro{cursor:default;justify-content:center}
.p.ro .pts{font-size:.68rem;font-weight:800;color:var(--accent);margin-top:3px}
.pl{flex-shrink:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:7px;padding:0 8px 8px}
.p{height:66px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.4rem;line-height:1;cursor:pointer;touch-action:manipulation;padding:0}
.p small{font-size:.62rem;font-weight:500;color:var(--muted);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.p.rdy{border:2px solid var(--accent)}
.pl.pk .p.selected{border:3px solid var(--accent);background:var(--btn)}
.p:active{background:var(--accent);color:#fff}
.teams{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px 10px}
.teams button{height:64px;border:none;border-radius:13px;font-weight:800;font-size:1rem;cursor:pointer;touch-action:manipulation;color:#fff}
.teams .tus{background:var(--accent)}
.teams .triv{background:var(--riv)}
.teams button.rdy{box-shadow:0 0 0 3px var(--text)}
.teams.pk button.selected{box-shadow:0 0 0 3px var(--accent)}
.teams button:active{filter:brightness(.85)}
.logh{flex-shrink:0;font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;padding:2px 12px}
.log{flex:1;min-height:110px;overflow:auto;margin:0 8px 8px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.empty{color:var(--muted);text-align:center;padding:20px;font-size:.85rem}
.ev{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 6px 7px 10px;border-bottom:1px solid var(--line);font-size:.85rem}
.ev .info{display:flex;align-items:center;gap:6px;min-width:0;flex:1;overflow:hidden}
.ev .n{flex-shrink:0;color:var(--muted);font-size:.7rem}
.ev .q{flex-shrink:0;color:var(--muted);font-size:.62rem;border:1px solid var(--line);border-radius:6px;padding:2px 5px}
.ev .k{flex-shrink:0;white-space:nowrap;font-weight:700;padding:3px 8px;border-radius:8px;font-size:.72rem;background:var(--btn)}
.ev .k.m{background:var(--ok);color:var(--okt)}
.ev .k.f{background:var(--ko);color:var(--kot)}
.ev .w{min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .w.riv{color:var(--riv)}
.ev .btns{display:flex;flex-shrink:0;gap:0}
.ev .btns button{border:none;background:none;font-size:1.1rem;padding:6px 7px;cursor:pointer}
.ev .btns .editbtn{color:var(--muted)}
.ev .btns .delbtn{color:var(--danger);font-size:1.25rem}
.pg{flex:1;min-height:0;padding:8px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.sec{font-weight:700;font-size:.75rem;color:var(--muted);text-transform:uppercase;margin-top:4px}
.er{display:flex;gap:6px}
.er input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);min-width:0}
.er .no{width:64px;text-align:center}
.er .nm{flex:1}
.del{border:none;background:none;color:var(--danger);font-size:1.3rem;padding:6px 10px;cursor:pointer}
.ck{display:flex;gap:10px;align-items:center;font-size:.9rem;padding:6px 2px}
.ck input{width:22px;height:22px;accent-color:var(--accent)}
.numset{display:flex;align-items:center;gap:10px}
.numset input{width:64px;text-align:center;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;font-size:.85rem;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
table{width:100%;table-layout:fixed;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:.78rem}
th,td{padding:8px 2px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:.6rem;color:var(--muted);text-transform:uppercase}
td:first-child,th:first-child{text-align:left;padding-left:6px;overflow-wrap:anywhere;font-weight:600}
td.pt{font-weight:800;color:var(--accent)}
tr.tot td{font-weight:800;background:var(--btn)}
tr.tot td:first-child{border-left:3px solid var(--accent)}
tr.riv td{font-weight:800;color:var(--riv);background:var(--rivbg)}
tr.riv td:first-child{border-left:3px solid var(--riv)}
tr.riv td.pt{color:var(--riv)}
.leg{font-size:.7rem;color:var(--muted)}
.ex{display:flex;gap:8px}
.ex .tb{flex:1;padding:12px;font-size:.85rem}
.tlist{flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow{display:flex;flex-direction:column;gap:8px;padding:11px 8px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow .tname{font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tname small{display:block;font-weight:500;color:var(--accent);font-size:.65rem}
.trow .tbtns{display:flex;gap:6px}
.trow .tbtns button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:11px 4px;font-size:.82rem;font-weight:700;cursor:pointer}
.trow .tbtns button.dg{color:var(--danger);flex:0 0 52px}
.trow .tbtns button.load{background:var(--accent);color:#fff;border-color:var(--accent)}
.tnameinput{font:inherit;font-weight:700;font-size:1rem;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);width:100%}
.namefield{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY="bball-log-v2",OLDKEY="bball-log-v1";
var ACT=[
 {id:"fal",l:"Falta",k:"n",grp:"fal",cat:"Falta",sub:""},
 {id:"per",l:"Pérdida",k:"n",grp:"per",cat:"Pérdida",sub:""},
 {id:"rob",l:"Robo",k:"n",grp:"rob",cat:"Robo",sub:""},
 {id:"reb",l:"Rebote",k:"n",grp:"reb",cat:"Rebote",sub:""},
 {id:"l1",l:"T. libre ✓",k:"m",grp:"lib",cat:"Tiro libre",sub:"✓ acierto"},
 {id:"d1",l:"Tiro 2 ✓",k:"m",grp:"d2",cat:"Tiro de 2",sub:"✓ acierto"},
 {id:"t1",l:"Tiro 3 ✓",k:"m",grp:"t3",cat:"Tiro de 3",sub:"✓ acierto"},
 {id:"l0",l:"T. libre ✗",k:"f",grp:"lib",cat:"Tiro libre",sub:"✗ fallo"},
 {id:"d0",l:"Tiro 2 ✗",k:"f",grp:"d2",cat:"Tiro de 2",sub:"✗ fallo"},
 {id:"t0",l:"Tiro 3 ✗",k:"f",grp:"t3",cat:"Tiro de 3",sub:"✗ fallo"}
];
var GROUPS=[{id:"fal",l:"Falta"},{id:"per",l:"Pérdida"},{id:"rob",l:"Robo"},{id:"reb",l:"Rebote"},{id:"lib",l:"Tiro libre"},{id:"d2",l:"Tiro de 2"},{id:"t3",l:"Tiro de 3"}];
function act(id){return ACT.filter(function(a){return a.id===id;})[0];}
var S={players:[],events:[],teams:[],activeTeam:null,editTeamId:null,enabled:{fal:1,per:1,rob:1,reb:1,lib:1,d2:1,t3:1},periods:4,period:1,home:true,clubName:"Nosotros",opponentName:"Rival",theme:"system",picker:null,view:"main",msg:"",warn:false};
var seq=0;
function uid(){seq++;return Date.now().toString(36)+seq;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function lab(p){return p.num!==""?p.num:(p.name?p.name.charAt(0).toUpperCase():"?");}
function who(p){return p?((p.num!==""?"#"+p.num:"")+(p.name?" "+p.name:"")||"?"):"(eliminado)";}
function pl(id){return S.players.filter(function(p){return p.id===id;})[0];}
function isNum(v){return v!==""&&!isNaN(v);}
function sortedPlayers(){
  var withIdx=S.players.map(function(p,i){return {p:p,i:i};});
  withIdx.sort(function(a,b){
    var an=isNum(a.p.num),bn=isNum(b.p.num);
    if(an&&bn)return parseFloat(a.p.num)-parseFloat(b.p.num);
    if(an&&!bn)return -1;
    if(!an&&bn)return 1;
    return a.i-b.i;
  });
  return withIdx.map(function(x){return x.p;});
}
function whoLbl(side,p){if(side==="rival")return "Rival";return p?who(pl(p)):"Equipo";}
function foulsOf(pid){return S.events.filter(function(e){return e.side==="us"&&e.p===pid&&e.a==="fal";}).length;}
function foulsInPeriod(side,q){return S.events.filter(function(e){return e.side===side&&e.a==="fal"&&(e.q||1)===q;}).length;}
function ptsOf(pid){
  var t=0;
  S.events.forEach(function(e){if(e.side==="us"&&e.p===pid){if(e.a==="l1")t+=1;else if(e.a==="d1")t+=2;else if(e.a==="t1")t+=3;}});
  return t;
}
function evLabel(e){
  var a=act(e.a);
  if(e.a==="reb"&&e.off!==undefined)return a.l+(e.off?" ofensivo":" defensivo");
  return a.l;
}
function badge(text,k){return '<span class="pkbadge '+(k||"n")+'">'+esc(text)+'</span>';}
function subTitle(a){return badge(a.cat,a.k)+(a.sub?'<span class="pksub">'+esc(a.sub)+'</span>':"");}
function battery(n,cls,max){
  max=max||5;
  var c=cls||"bat";
  return '<span class="'+c+'">'+Array.from({length:max},function(_,i){return '<i class="'+(i<n?"on"+(n>=max?" over":""):"")+'"></i>';}).join("")+'</span>';
}
function selectablePlayers(){return sortedPlayers().filter(function(p){return foulsOf(p.id)<5;});}
function applyLoaded(d){
  S.players=d.players||[];S.events=d.events||[];
  S.periods=d.periods||4;S.period=Math.min(d.period||1,S.periods);
  S.home=d.home===undefined?true:!!d.home;
  S.clubName=d.clubName===undefined?"Nosotros":String(d.clubName);
  S.opponentName=d.opponentName===undefined?"Rival":String(d.opponentName);
  if(d.enabled)for(var k in S.enabled)if(k in d.enabled)S.enabled[k]=!!d.enabled[k];
  S.teams=d.teams||[];S.activeTeam=d.activeTeam||null;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.players&&d.players.length){applyLoaded(d);return;}}}catch(e){}
  try{
    var r1=localStorage.getItem(OLDKEY);
    if(r1){var d1=JSON.parse(r1);
      if(d1&&d1.players&&d1.players.length){
        var events=(d1.events||[]).map(function(e){return {id:e.id||uid(),side:"us",p:e.p==="team"?null:e.p,a:e.a,q:e.q||1};});
        applyLoaded({players:d1.players,events:events,periods:d1.periods||4,period:d1.period||1,home:true});
        save();return;
      }
    }
  }catch(e){}
  for(var i=1;i<=10;i++)S.players.push({id:uid(),num:String(i),name:""});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({players:S.players,events:S.events,teams:S.teams,activeTeam:S.activeTeam,enabled:S.enabled,periods:S.periods,period:S.period,home:S.home,clubName:S.clubName,opponentName:S.opponentName}));}catch(e){}}
function blankRoster(){return Array.from({length:10},function(_,i){return {id:uid(),num:String(i+1),name:""};});}
function findTeam(id){return S.teams.filter(function(t){return t.id===id;})[0];}
function applyTheme(t){
  if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
}
function loadTheme(){try{S.theme=localStorage.getItem("bball-theme")||"system";}catch(e){S.theme="system";}applyTheme(S.theme);}
function setTheme(t){S.theme=t;try{localStorage.setItem("bball-theme",t);}catch(e){}applyTheme(t);}
function flash(m,w){S.msg=m;S.warn=!!w;render();setTimeout(function(){if(S.msg===m){S.msg="";S.warn=false;if(S.view==="main")render();}},1700);}
function scoreOf(side){var t=0;S.events.forEach(function(e){if(e.side!==side)return;if(e.a==="l1")t+=1;else if(e.a==="d1")t+=2;else if(e.a==="t1")t+=3;});return t;}

function openPicker(opts){S.picker=opts;render();}
function closePicker(){
  var o=S.picker;S.picker=null;
  if(o&&o.onCancel)o.onCancel();
  render();
}
function pickTarget(side,p){
  var o=S.picker;S.picker=null;
  if(o&&o.onPick)o.onPick(side,p);
  render();
}
function pickAction(id){
  var o=S.picker;S.picker=null;
  if(o&&o.onPickAction)o.onPickAction(id);
  render();
}
function renderPicker(){
  var o=S.picker;if(!o)return "";
  var h='<div class="pkoverlay"><div class="pksheet">';
  h+='<div class="pkhead"><span class="pktitle">'+(o.titleHtml||esc(o.title||""))+'</span><button data-pkcancel="1" aria-label="Cerrar">✕</button></div>';
  if(o.actions){
    h+='<div class="pkactlist">'+o.actions.map(function(a){
      return '<button class="pkact '+a.k+(a.id===o.selectedAction?" selected":"")+'" data-pkact="'+a.id+'">'+esc(a.cat)+(a.sub?' <span class="pksub2">'+esc(a.sub)+'</span>':'')+'</button>';
    }).join("")+'</div>';
  }else{
    var plist=o.allPlayers?sortedPlayers():selectablePlayers();
    if(plist.length)h+='<div class="pl pk">'+plist.map(function(p){

function finalizeAction(id,side,p){
  var a=act(id);
  if(navigator.vibrate){try{navigator.vibrate(20);}catch(x){}}
  if(id==="rob"){
    var pairId=uid(),oppSide=side==="us"?"rival":"us";
    S.events.push({id:uid(),side:side,p:p,a:"rob",q:S.period,pairId:pairId});
    if(oppSide==="rival"){
      S.events.push({id:uid(),side:"rival",p:null,a:"per",q:S.period,pairId:pairId});
      save();flash("✔ "+a.l+" · "+whoLbl(side,p)+" · Pérdida automática al rival");
    }else{
      save();flash("✔ "+a.l+" · "+whoLbl(side,p));
      if(!selectablePlayers().length){
        S.events.push({id:uid(),side:"us",p:null,a:"per",q:S.period,pairId:pairId});save();
      }else{
        openPicker({
          titleHtml:badge("Pérdida","n")+'<span class="pksub">¿quién la perdió?</span>',teamRow:false,extra:"Equipo",
          onPick:function(side2,p2){S.events.push({id:uid(),side:"us",p:p2,a:"per",q:S.period,pairId:pairId});save();},
          onCancel:function(){S.events.push({id:uid(),side:"us",p:null,a:"per",q:S.period,pairId:pairId});save();}
        });
      }
    }
    return;
  }
  S.events.push({id:uid(),side:side,p:p,a:id,q:S.period});
  save();
  flash("✔ "+a.l+" · "+whoLbl(side,p));
  if((id==="l0"||id==="d0"||id==="t0")&&S.enabled.reb){
    openPicker({
      titleHtml:badge("Rebote","n")+'<span class="pksub">¿quién lo coge?</span>',teamRow:true,rival:true,extra:"No hay rebote",
      onPick:function(side3,p3){

        flash("✔ Rebote "+(off?"ofensivo":"defensivo")+" · "+whoLbl(side3,p3));
      },
      onCancel:function(){}
    });
  }
}

function empty(){return {fal:0,per:0,rob:0,reb:0,l1:0,l0:0,d1:0,d0:0,t1:0,t0:0};}
function computeTable(evs){
  var rows=[],totC=empty(),totPt=0;
  var clubName=S.clubName.trim()||"Nosotros",opponentName=S.opponentName.trim()||"Rival";
  S.players.forEach(function(p){
    var c=empty();evs.forEach(function(e){if(e.side==="us"&&e.p===p.id)c[e.a]++;});
    var pt=c.l1+2*c.d1+3*c.t1;
    rows.push({name:who(p),pt:pt,c:c,cls:""});
    for(var k in c)totC[k]+=c[k];totPt+=pt;
  });
  var eqEvs=evs.filter(function(e){return e.side==="us"&&!e.p;});
  if(eqEvs.length){
    var ce=empty();eqEvs.forEach(function(e){ce[e.a]++;});
    var pte=ce.l1+2*ce.d1+3*ce.t1;
    rows.push({name:"Equipo",pt:pte,c:ce,cls:""});
    for(var k in ce)totC[k]+=ce[k];totPt+=pte;
  }
  rows.push({name:"Total "+clubName,pt:totPt,c:totC,cls:"tot"});
  var rivEvs=evs.filter(function(e){return e.side==="rival";});
  var cr=empty();rivEvs.forEach(function(e){cr[e.a]++;});
  var ptr=cr.l1+2*cr.d1+3*cr.t1;
  rows.push({name:opponentName,pt:ptr,c:cr,cls:"riv"});
  return rows;
}
function statTable(evs,title){
  var rows=computeTable(evs);
  var body=rows.map(function(r){return '<tr class="'+r.cls+'"><td>'+esc(r.name)+'</td><td class="pt">'+r.pt+'</td><td>'+r.c.fal+'</td><td>'+r.c.per+'</td><td>'+r.c.rob+'</td><td>'+r.c.reb+'</td><td>'+r.c.l1+'/'+(r.c.l1+r.c.l0)+'</td><td>'+r.c.d1+'/'+(r.c.d1+r.c.d0)+'</td><td>'+r.c.t1+'/'+(r.c.t1+r.c.t0)+'</td></tr>';}).join("");
  return '<div class="sec">'+title+'</div><table><colgroup><col style="width:24%"><col style="width:8%"><col style="width:8%"><col style="width:9%"><col style="width:8%"><col style="width:8.5%"><col style="width:11.5%"><col style="width:11.5%"><col style="width:11.5%"></colgroup><tr><th>Equipo/jugador</th><th>Pts</th><th>Fal</th><th>Pér</th><th>Rob</th><th>Reb</th><th>TL</th><th>T2</th><th>T3</th></tr>'+body+'</table>';
}

function today(){var d=new Date();function z(n){return (n<10?"0":"")+n;}return {iso:d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())};}
function csvq(v){v=String(v);return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
async function saveFile(name,data,mime){
  try{
    if(window.claude&&window.claude.use){
      var dl=await window.claude.use("downloads");
      if(dl){await dl.save({filename:name,data:data});return;}
    }
  }catch(e){if(e&&(e.code==="declined"||e.code==="rate_limited"))return;}
  var blob=new Blob([data],{type:mime}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
}
function exportCsv(){
  var head=["Equipo/jugador","Puntos","Faltas","Pérdidas","Robos","Rebotes","TL acierto","TL fallo","T2 acierto","T2 fallo","T3 acierto","T3 fallo"];
  var sections=[{title:"Total del partido",evs:S.events}];
  var qLabel=S.periods<=4?"Cuarto ":"Tiempo ";
  for(var n=1;n<=S.periods;n++){var evs=S.events.filter(function(e){return (e.q||1)===n;});if(evs.length)sections.push({title:qLabel+n,evs:evs});}
  var lines=[];
  sections.forEach(function(sec,i){
    if(i>0)lines.push([""]);
    lines.push([sec.title]);lines.push(head);
    computeTable(sec.evs).forEach(function(r){lines.push([r.name,r.pt,r.c.fal,r.c.per,r.c.rob,r.c.reb,r.c.l1,r.c.l0,r.c.d1,r.c.d0,r.c.t1,r.c.t0]);});
  });
  var csv="\uFEFF"+lines.map(function(r){return r.map(csvq).join(";");}).join("\r\n")+"\r\n";
  saveFile("estadisticas-baloncesto-"+today().iso+".csv",csv,"text/csv;charset=utf-8");
}

document.getElementById("app").addEventListener("click",function(e){
  if(e.target&&e.target.classList&&e.target.classList.contains("pkoverlay")){closePicker();return;}
  var b=e.target.closest("button");if(!b)return;
  var d=b.dataset;
  if(d.a){startAction(d.a);return;}
  if(d.per){S.period=+d.per;save();render();return;}
  if(d.pks!==undefined){pickTarget(d.pks,d.pkp||null);return;}
  if(d.pkcancel!==undefined){closePicker();return;}
  if(d.pkact!==undefined){pickAction(d.pkact);return;}
  if(d.edit){startEdit(d.edit);return;}
  if(d.del){
    var ev=S.events.filter(function(v){return v.id===d.del;})[0];
    if(ev&&ev.pairId)S.events.forEach(function(v){if(v.id!==ev.id&&v.pairId===ev.pairId)delete v.pairId;});
    S.events=S.events.filter(function(v){return v.id!==d.del;});
    save();render();return;
  }
  if(d.delp){
    var n=S.events.filter(function(v){return v.side==="us"&&v.p===d.delp;}).length;
    if(confirm("¿Eliminar este jugador"+(n?" y sus "+n+" acciones registradas":"")+"?")){
      S.players=S.players.filter(function(p){return p.id!==d.delp;});
      S.events=S.events.filter(function(v){return !(v.side==="us"&&v.p===d.delp);});
      save();render();
    }
    return;
  }
  if(b.id==="xcsv"){exportCsv();return;}
  if(d.theme){setTheme(d.theme);render();return;}
  if(d.editteam){S.editTeamId=d.editteam;S.view="team";render();return;}
  if(d.loadteam){
    var lt=findTeam(d.loadteam);if(!lt)return;
    if(!confirm('¿Cargar el equipo "'+lt.name+'"? Sustituye a los jugadores actuales y empieza un partido nuevo (se borra el registro).'))return;
    S.players=lt.players.map(function(p){return {id:uid(),num:p.num,name:p.name};});
    S.events=[];S.period=1;S.activeTeam=lt.id;S.view="main";save();render();return;
  }
  if(d.delteam){
    var dt=findTeam(d.delteam);if(!dt)return;
    if(!confirm('¿Eliminar el equipo "'+dt.name+'"? Esto no afecta al partido actual.'))return;
    S.teams=S.teams.filter(function(t){return t.id!==d.delteam;});
    if(S.activeTeam===d.delteam)S.activeTeam=null;
    save();render();return;
  }
  if(d.taddp){
    var tm=findTeam(d.taddp);if(tm){tm.players.push({id:uid(),num:"",name:""});save();render();}
    return;
  }
  if(d.tdelp){
    var parts=d.tdelp.split("|"),tm2=findTeam(parts[0]);
    if(tm2){
      if(confirm("¿Eliminar a este jugador de la plantilla?")){tm2.players=tm2.players.filter(function(p){return p.id!==parts[1];});save();render();}
    }
    return;
  }
  var x=d.x;if(!x)return;
  if(x==="set"){S.view="set";}
  else if(x==="fin"){S.view="sum";}
  else if(x==="back")S.view="main";
  else if(x==="back2set")S.view="set";
  else if(x==="back2teams")S.view="teams";
  else if(x==="teams")S.view="teams";
  else if(x==="add"){S.players.push({id:uid(),num:"",name:""});save();}
  else if(x==="blank"){
    if(!confirm("¿Sustituir los jugadores actuales por una plantilla en blanco (10 dorsales sin nombre)? Se borrará el registro del partido."))return;
    S.players=blankRoster();S.events=[];S.period=1;S.activeTeam=null;save();
  }
  else if(x==="newteam"){
    var nn=prompt("Nombre del nuevo equipo:");if(nn===null)return;nn=nn.trim();if(!nn)return;
    var nt={id:uid(),name:nn,players:blankRoster()};S.teams.push(nt);save();
    S.editTeamId=nt.id;S.view="team";
  }
  else if(x==="saveteam"){
    var sn=prompt("Guardar la plantilla actual como equipo. Nombre:");if(sn===null)return;sn=sn.trim();if(!sn)return;
    var newTeam={id:uid(),name:sn,players:S.players.map(function(p){return {id:uid(),num:p.num,name:p.name};})};
    S.teams.push(newTeam);S.activeTeam=newTeam.id;save();
  }
  else if(x==="new"){
    if(!confirm("¿Empezar un nuevo partido? Se borrará todo el registro (jugadores y ajustes se mantienen)."))return;
    S.events=[];S.period=1;S.view="main";save();
  }
  render();
});
document.getElementById("app").addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.grp){S.enabled[t.dataset.grp]=t.checked?1:0;save();return;}
  if(t.id==="home"){S.home=t.checked;save();return;}
  if(t.id==="nper"){
    var v=Math.max(1,Math.min(8,parseInt(t.value,10)||4));
    S.periods=v;if(S.period>v)S.period=v;save();
  }
});
document.getElementById("app").addEventListener("input",function(e){
  var t=e.target;
  if(t.dataset.f){var p=pl(t.dataset.id);if(p){p[t.dataset.f]=t.value;save();}return;}
  if(t.dataset.tf){
    var parts=t.dataset.tid.split("|"),tm=findTeam(parts[0]),tp=tm&&tm.players.filter(function(x){return x.id===parts[1];})[0];
    if(tp){tp[t.dataset.tf]=t.value;save();}
    return;
  }
  if(t.dataset.tname){var tm2=findTeam(t.dataset.tname);if(tm2){tm2.name=t.value;save();}return;}
  if(t.dataset.scoreName){S[t.dataset.scoreName]=t.value;save();return;}
});
loadTheme();load();render();
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
