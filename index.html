<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estadísticas de baloncesto</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f5f7;--card:#fff;--text:#1c1c1e;--muted:#6b6b70;--line:#dcdce0;--accent:#ea6a1f;--btn:#fff4ec;--ok:#dff3e4;--okt:#1b6b32;--ko:#fbe3e3;--kot:#b3261e;--danger:#c62828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1e1e22;--text:#f2f2f4;--muted:#9a9aa1;--line:#333338;--accent:#ff8a3d;--btn:#2b2119;--ok:#1d3325;--okt:#7fdc99;--ko:#3a1f1f;--kot:#f28b82;--danger:#ef6b6b}}
:root[data-theme="dark"]{--bg:#121214;--card:#1e1e22;--text:#f2f2f4;--muted:#9a9aa1;--line:#333338;--accent:#ff8a3d;--btn:#2b2119;--ok:#1d3325;--okt:#7fdc99;--ko:#3a1f1f;--kot:#f28b82;--danger:#ef6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{height:100%;height:100dvh;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
header{flex-shrink:0;display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 8px}
h1{font-size:1rem;margin:0}
.bar{display:flex;gap:4px}
.tb{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:7px 7px;font-size:.72rem;cursor:pointer}
.tb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb:disabled{opacity:.4}
.tb.fixon{background:var(--danger);color:#fff;border-color:var(--danger)}
.wrap{flex:1;min-height:0;margin:0 4px;background:var(--card);border-radius:10px;border:1px solid var(--line);padding:0;overflow:auto;display:flex;flex-direction:column}
.wrap.fix{border-color:var(--danger);border-width:2px}
.wrap.fix .c,.wrap.fix .m,.wrap.fix .f{outline:2px dashed var(--danger);outline-offset:-3px}
.g{display:grid;flex:1 0 auto;padding:3px;gap:3px}
.g>div,.g>button{min-width:0;min-height:0}
.h{position:sticky;top:0;z-index:2;background:var(--card);box-shadow:0 3px 0 var(--card);font-size:clamp(.55rem,2.4vw,.7rem);color:var(--muted);font-weight:700;text-align:center;align-self:end;padding-bottom:2px;text-transform:uppercase}
.sp{grid-column:span 2}
.tot{position:sticky;bottom:0;z-index:2;box-shadow:0 -3px 0 var(--card)}
.nm.tot,.pt.tot{background:var(--card)}
.nm{font-weight:600;font-size:clamp(.65rem,3vw,.85rem);display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-left:2px}
.pt{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(.85rem,4vw,1.15rem);color:var(--accent)}
.c,.m,.f{border:none;border-radius:8px;font-weight:700;font-size:clamp(.75rem,3.8vw,1.15rem);cursor:pointer;touch-action:manipulation;padding:0;color:var(--text)}
.c{background:var(--btn)}
.c:active{background:var(--accent);color:#fff}
.m{background:var(--ok);color:var(--okt)}
.f{background:var(--ko);color:var(--kot)}
.m:active,.f:active{filter:brightness(.8)}
.tt{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:clamp(.65rem,3vw,.85rem);background:var(--bg);border-radius:8px;line-height:1.1}
.tt small{font-weight:500;color:var(--muted);font-size:.6rem}
.tt.sp2{grid-column:span 2}
.ed{display:flex;flex-direction:column;gap:6px;padding:8px}
.sec{font-weight:700;font-size:.75rem;color:var(--muted);text-transform:uppercase;margin-top:6px}
.ck{display:flex;gap:10px;align-items:center;padding:6px 2px;font-size:.9rem}
.lb{display:flex;gap:10px;align-items:center;flex:1}
.ck .tb{padding:9px 12px;font-size:.85rem}
.ck input{width:22px;height:22px;accent-color:var(--accent)}
.er{display:flex;gap:6px}
input.n{flex:1;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.del{border:none;background:none;color:var(--danger);font-size:1.3rem;cursor:pointer;padding:6px 10px}
.hint{flex-shrink:0;color:var(--muted);font-size:.6rem;text-align:center;margin:4px 8px 6px;line-height:1.3}
</style>
</head>
<body>
<header>
  <h1>🏀</h1>
  <div class="bar">
    <button class="tb" id="undo">↩ Deshacer</button>
    <button class="tb" id="fix">− Corregir</button>
    <button class="tb" id="edit">⚙ Ajustes</button>
    <button class="tb" id="reset">Nuevo</button>
  </div>
</header>
<div class="wrap" id="w"></div>
<p class="hint" id="hint"></p>

<script>
var KEY="bball-stats-v2";
var DEF=[
 {id:"pts",lbl:"Puntos (calculados de los tiros con tipo)",h:"Pts",t:"pts"},
 {id:"s0",lbl:"Faltas",h:"Fal",t:"s",i:0},
 {id:"s1",lbl:"Pérdidas",h:"Pér",t:"s",i:1},
 {id:"s2",lbl:"Robos",h:"Rob",t:"s",i:2},
 {id:"s3",lbl:"Rebotes",h:"Reb",t:"s",i:3},
 {id:"h0",lbl:"Tiros libres (1P)",h:"TL",t:"sh",i:0},
 {id:"h1",lbl:"Tiros de 2 (2P)",h:"T2",t:"sh",i:1},
 {id:"h2",lbl:"Tiros de 3 (3P)",h:"T3",t:"sh",i:2},
 {id:"g",lbl:"Canastas sin distinguir tipo (no suman puntos)",h:"Can",t:"g"}
];
var state={players:[],editing:false,fix:false,cols:{},order:DEF.map(function(c){return c.id;})};
DEF.forEach(function(c){state.cols[c.id]=c.id!=="g";});
var undo=[];
var uid=0;

function newPlayer(name){uid++;return {id:Date.now()+"-"+uid,name:name,s:[0,0,0,0],sh:[[0,0],[0,0],[0,0]],gen:[0,0]};}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){
      var d=JSON.parse(r);
      if(d&&d.players&&d.players.length){
        state.players=d.players;
        state.players.forEach(function(p){if(!p.gen)p.gen=[0,0];});
        if(d.cols)for(var k in d.cols)if(k in state.cols)state.cols[k]=!!d.cols[k];
        if(d.order){var o=d.order.filter(function(id){return id in state.cols;});state.order.forEach(function(id){if(o.indexOf(id)<0)o.push(id);});state.order=o;}
        return;
      }
    }
  }catch(e){}
  for(var i=1;i<=10;i++)state.players.push(newPlayer("Jugador "+i));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({players:state.players,cols:state.cols,order:state.order}));}catch(e){}}
function byId(id){return DEF.filter(function(c){return c.id===id;})[0];}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function pts(p){return p.sh[0][0]+2*p.sh[1][0]+3*p.sh[2][0];}
function sum(f){return state.players.reduce(function(a,p){return a+f(p);},0);}
function pair(m,f){return '<div class="tt sp2 tot">'+m+"/"+(m+f)+"<small>"+(m+f?Math.round(100*m/(m+f))+"%":"–")+"</small></div>";}

function render(){
  var P=state.players,h="",n=P.length;
  var vis=state.order.map(byId).filter(function(c){return state.cols[c.id];});
  if(state.editing){
    h='<div class="ed"><div class="sec">Columnas: visibilidad y orden (de izquierda a derecha)</div>';
    state.order.forEach(function(id,ix){
      var c=byId(id);
      h+='<div class="ck"><label class="lb"><input type="checkbox" data-col="'+id+'"'+(state.cols[id]?" checked":"")+'>'+c.lbl+'</label>'
        +'<button class="tb" data-mv="'+id+'" data-d="-1"'+(ix===0?" disabled":"")+'>▲</button>'
        +'<button class="tb" data-mv="'+id+'" data-d="1"'+(ix===state.order.length-1?" disabled":"")+'>▼</button></div>';
    });
    h+='<div class="sec">Jugadores</div>';
    P.forEach(function(p,i){h+='<div class="er"><input class="n" data-i="'+i+'" value="'+esc(p.name)+'" maxlength="20"><button class="del" data-del="'+i+'" aria-label="Eliminar">✕</button></div>';});
    h+='<button class="tb" id="addp" style="padding:12px">+ Añadir jugador</button></div>';
  }else{
    var tpl="minmax(0,15fr)";
    vis.forEach(function(c){tpl+=c.t==="pts"?" minmax(0,8fr)":c.t==="s"?" minmax(0,9fr)":" minmax(0,6.8fr) minmax(0,6.8fr)";});
    h='<div class="g" style="grid-template-columns:'+tpl+';grid-template-rows:auto repeat('+n+',minmax(32px,1fr)) auto">';
    h+='<div class="h">Jug.</div>';
    vis.forEach(function(c){h+='<div class="h'+(c.t==="sh"||c.t==="g"?" sp":"")+'">'+c.h+'</div>';});
    P.forEach(function(p,i){
      h+='<div class="nm">'+esc(p.name)+'</div>';
      vis.forEach(function(c){
        if(c.t==="pts")h+='<div class="pt">'+pts(p)+'</div>';
        else if(c.t==="s")h+='<button class="c" data-i="'+i+'" data-j="'+c.i+'">'+p.s[c.i]+'</button>';
        else{
          var v=c.t==="g"?p.gen:p.sh[c.i],a=c.t==="g"?'data-g="1"':'data-k="'+c.i+'"';
          h+='<button class="m" data-i="'+i+'" '+a+' data-r="0">'+v[0]+'</button><button class="f" data-i="'+i+'" '+a+' data-r="1">'+v[1]+'</button>';
        }
      });
    });
    h+='<div class="nm tot">Total</div>';
    vis.forEach(function(c){
      if(c.t==="pts")h+='<div class="pt tot">'+sum(pts)+'</div>';
      else if(c.t==="s")h+='<div class="tt tot">'+sum(function(p){return p.s[c.i];})+'</div>';
      else{
        var g=c.t==="g";
        h+=pair(sum(function(p){return (g?p.gen:p.sh[c.i])[0];}),sum(function(p){return (g?p.gen:p.sh[c.i])[1];}));
      }
    });
    h+='</div>';
  }
  document.getElementById("w").innerHTML=h;
  document.getElementById("edit").classList.toggle("on",state.editing);
  document.getElementById("edit").textContent=state.editing?"✔ Listo":"⚙ Ajustes";
  document.getElementById("undo").disabled=!undo.length||state.editing;
  document.getElementById("fix").classList.toggle("fixon",state.fix);
  document.getElementById("fix").disabled=state.editing;
  document.getElementById("w").classList.toggle("fix",state.fix&&!state.editing);
  document.getElementById("hint").textContent=state.editing?"Elige qué columnas ver y su orden con ▲ ▼, edita nombres y pulsa «Listo». Los datos de las columnas ocultas se conservan.":state.fix?"MODO CORREGIR: cada toque resta 1. Vuelve a pulsar «Corregir» para volver a sumar.":"Fal=Faltas · Pér=Pérdidas · Rob=Robos · Reb=Rebotes · TL=T. libre · T2 · T3 · Can=Canastas (verde = acierto, rojo = fallo)";
}

document.getElementById("w").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.id==="addp"){state.players.push(newPlayer("Jugador "+(state.players.length+1)));save();render();return;}
  if(b.dataset.mv!==undefined){
    var ix=state.order.indexOf(b.dataset.mv),jx=ix+(+b.dataset.d);
    if(jx<0||jx>=state.order.length)return;
    var t=state.order[ix];state.order[ix]=state.order[jx];state.order[jx]=t;
    var w=document.getElementById("w"),sc=w.scrollTop;save();render();w.scrollTop=sc;return;
  }
  if(b.dataset.del!==undefined){
    if(confirm("¿Eliminar a este jugador?")){state.players.splice(+b.dataset.del,1);save();render();}
    return;
  }
  var i=b.dataset.i;if(i===undefined)return;
  var p=state.players[+i],d=state.fix?-1:1;
  if(b.dataset.j!==undefined){
    var j=+b.dataset.j;if(p.s[j]+d<0)return;
    p.s[j]+=d;if(d>0)undo.push([p.id,"s",j]);
  }else if(b.dataset.g!==undefined){
    var r=+b.dataset.r;if(p.gen[r]+d<0)return;
    p.gen[r]+=d;if(d>0)undo.push([p.id,"g",r]);
  }else if(b.dataset.k!==undefined){
    var k=+b.dataset.k,q=+b.dataset.r;if(p.sh[k][q]+d<0)return;
    p.sh[k][q]+=d;if(d>0)undo.push([p.id,"sh",k,q]);
  }else return;
  if(navigator.vibrate){try{navigator.vibrate(15);}catch(x){}}
  save();render();
});
document.getElementById("w").addEventListener("input",function(e){
  if(e.target.classList.contains("n")){state.players[+e.target.dataset.i].name=e.target.value;save();}
});
document.getElementById("w").addEventListener("change",function(e){
  if(e.target.dataset.col){state.cols[e.target.dataset.col]=e.target.checked;save();}
});
document.getElementById("undo").onclick=function(){
  var u=undo.pop();if(!u)return;
  var p=state.players.filter(function(x){return x.id===u[0];})[0];
  if(p){
    if(u[1]==="s"){if(p.s[u[2]]>0)p.s[u[2]]--;}
    else if(u[1]==="g"){if(p.gen[u[2]]>0)p.gen[u[2]]--;}
    else if(p.sh[u[2]][u[3]]>0)p.sh[u[2]][u[3]]--;
  }
  save();render();
};
document.getElementById("fix").onclick=function(){state.fix=!state.fix;render();};
document.getElementById("edit").onclick=function(){state.editing=!state.editing;render();};
document.getElementById("reset").onclick=function(){
  if(confirm("¿Empezar un nuevo partido? Se pondrán todas las estadísticas a cero (los jugadores y las columnas elegidas se mantienen).")){
    state.players.forEach(function(p){p.s=[0,0,0,0];p.sh=[[0,0],[0,0],[0,0]];p.gen=[0,0];});undo=[];save();render();
  }
};
load();render();
</script>
</body>
</html>
