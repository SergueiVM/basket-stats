<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estadísticas de baloncesto - registro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ea6a1f">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/svg+xml" href="icon.svg" sizes="any">
<link rel="apple-touch-icon" href="icon-192-install-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baloncesto">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f5f7;--card:#fff;--text:#1c1c1e;--muted:#6b6b70;--line:#dcdce0;--accent:#ea6a1f;--btn:#fff4ec;--action-bg:#cff4fc;--action-text:#055160;--ok:#dff3e4;--okt:#1b6b32;--ko:#fbe3e3;--kot:#b3261e;--palette-blue-bg:#dbeafe;--palette-blue-text:#1e40af;--palette-cyan-bg:#cffafe;--palette-cyan-text:#155e75;--palette-teal-bg:#ccfbf1;--palette-teal-text:#115e59;--palette-green-bg:#dcfce7;--palette-green-text:#166534;--palette-lime-bg:#ecfccb;--palette-lime-text:#3f6212;--palette-yellow-bg:#fef3c7;--palette-yellow-text:#854d0e;--palette-orange-bg:#ffedd5;--palette-orange-text:#9a3412;--palette-coral-bg:#ffe4e1;--palette-coral-text:#9f2d20;--palette-red-bg:#fee2e2;--palette-red-text:#991b1b;--palette-pink-bg:#fce7f3;--palette-pink-text:#9d174d;--palette-purple-bg:#f3e8ff;--palette-purple-text:#6b21a8;--palette-lavender-bg:#ede9fe;--palette-lavender-text:#5b21b6;--palette-gray-bg:#e5e7eb;--palette-gray-text:#374151;--palette-brown-bg:#f0e2d3;--palette-brown-text:#713f12;--danger:#c62828;--riv:#2f6fed;--rivbg:#eaf0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1e1e22;--text:#f2f2f4;--muted:#9a9aa1;--line:#333338;--accent:#ff8a3d;--btn:#2b2119;--action-bg:#123a52;--action-text:#c2e7ff;--ok:#1d3325;--okt:#7fdc99;--ko:#3a1f1f;--kot:#f28b82;--palette-blue-bg:#1e3554;--palette-blue-text:#bfdbfe;--palette-cyan-bg:#16404a;--palette-cyan-text:#a5f3fc;--palette-teal-bg:#12413b;--palette-teal-text:#99f6e4;--palette-green-bg:#123c27;--palette-green-text:#86efac;--palette-lime-bg:#304314;--palette-lime-text:#d9f99d;--palette-yellow-bg:#443512;--palette-yellow-text:#fde68a;--palette-orange-bg:#4a2817;--palette-orange-text:#fdba74;--palette-coral-bg:#4b2521;--palette-coral-text:#ffb4a8;--palette-red-bg:#491b1b;--palette-red-text:#fca5a5;--palette-pink-bg:#4a2036;--palette-pink-text:#f9a8d4;--palette-purple-bg:#39204d;--palette-purple-text:#d8b4fe;--palette-lavender-bg:#352b55;--palette-lavender-text:#ddd6fe;--palette-gray-bg:#30333a;--palette-gray-text:#d1d5db;--palette-brown-bg:#422d1c;--palette-brown-text:#e7c7a3;--danger:#ef6b6b;--riv:#5b8dff;--rivbg:#222d45}}
:root[data-theme="dark"]{--bg:#121214;--card:#1e1e22;--text:#f2f2f4;--muted:#9a9aa1;--line:#333338;--accent:#ff8a3d;--btn:#2b2119;--action-bg:#123a52;--action-text:#c2e7ff;--ok:#1d3325;--okt:#7fdc99;--ko:#3a1f1f;--kot:#f28b82;--palette-blue-bg:#1e3554;--palette-blue-text:#bfdbfe;--palette-cyan-bg:#16404a;--palette-cyan-text:#a5f3fc;--palette-teal-bg:#12413b;--palette-teal-text:#99f6e4;--palette-green-bg:#123c27;--palette-green-text:#86efac;--palette-lime-bg:#304314;--palette-lime-text:#d9f99d;--palette-yellow-bg:#443512;--palette-yellow-text:#fde68a;--palette-orange-bg:#4a2817;--palette-orange-text:#fdba74;--palette-coral-bg:#4b2521;--palette-coral-text:#ffb4a8;--palette-red-bg:#491b1b;--palette-red-text:#fca5a5;--palette-pink-bg:#4a2036;--palette-pink-text:#f9a8d4;--palette-purple-bg:#39204d;--palette-purple-text:#d8b4fe;--palette-lavender-bg:#352b55;--palette-lavender-text:#ddd6fe;--palette-gray-bg:#30333a;--palette-gray-text:#d1d5db;--palette-brown-bg:#422d1c;--palette-brown-text:#e7c7a3;--danger:#ef6b6b;--riv:#5b8dff;--rivbg:#222d45}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{height:100%;height:100dvh;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:auto}
#app{min-height:100%;height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
@media (min-width:700px){#app{max-width:1200px}}
header{flex-shrink:0;display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 8px}
h1{font-size:1rem;margin:0}
.bar{display:flex;gap:6px}
.tb{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:9px 11px;font-size:.8rem;cursor:pointer}
.matchhead .bar{gap:3px}
.matchhead .tb{min-height:40px;padding:8px 6px;font-size:.72rem;white-space:nowrap}
.matchhead .tb i{margin-right:3px}
.matchhead h1{font-size:.85rem;white-space:nowrap}
.tb.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb.dg{color:var(--danger)}
.period-toggles{display:flex;flex-wrap:wrap;gap:8px}
.period-toggle{min-width:48px;min-height:40px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font-size:.85rem;font-weight:800;cursor:pointer}
.period-toggle.on{border-color:var(--accent);background:var(--accent);color:#fff}
.period-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.period-count-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.period-count-option{min-width:0;min-height:46px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font-size:.9rem;font-weight:800;cursor:pointer;touch-action:manipulation}
.period-count-option.on{border-color:var(--accent);background:var(--accent);color:#fff}
.period-count-custom{padding-right:5px;padding-left:5px;font-size:.72rem;white-space:nowrap}
.custom-period-count{width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font:inherit}
.summary-period-row{display:flex;align-items:center;gap:8px}
.summary-period-row .period-toggles{flex:1;min-width:0}
.summary-period-row .summary-visibility{flex:0 0 44px;background:var(--rivbg);border-color:var(--riv);color:var(--riv)}
.summary-period-row .summary-visibility[aria-pressed="true"]{background:var(--riv);color:#fff}
.perwrap{flex-shrink:0;margin:2px 8px 8px;padding:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.per{display:flex;gap:8px;overflow-x:auto}
.per button{flex:0 0 auto;min-width:52px;height:48px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;font-weight:800;font-size:.92rem;cursor:pointer;padding:0 12px}
.per button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.score{flex-shrink:0;margin:0 8px 10px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:12px}
.score .team{position:relative;display:flex;flex:1;flex-direction:column;align-items:center;min-width:0}
.score .team:first-child{padding-left:44px}
.score .team:last-child{padding-right:44px}
.score .teaminfo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;max-width:100%;white-space:nowrap}
.score .lbl{font-size:.64rem;color:var(--muted);text-transform:uppercase;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.score .tag{font-size:.56rem;color:var(--accent);font-weight:700}
.score .team.riv .tag{color:var(--riv)}
.score .val{font-size:2rem;font-weight:800;line-height:1.1}
.score .team.riv .val{color:var(--riv)}
.score .team.ours .val{color:var(--accent)}
.score .dash{font-size:1.5rem;color:var(--muted);font-weight:700}
.score .fouls{font-size:.6rem;color:var(--muted);margin-top:3px}
.scoreline{position:static;display:flex;width:100%;min-height:36px;align-items:center;justify-content:center;gap:6px}
.score .timeout{position:absolute;top:auto;bottom:0;min-width:44px;min-height:36px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font-size:.82rem;font-weight:800;cursor:pointer;touch-action:manipulation}
.score .team:first-child .timeout{left:0}
.score .team:last-child .timeout{right:0}
.score .timeout:active{background:var(--accent);color:#fff}
.score .team.riv .fouls{color:var(--riv)}
.actsA{flex-shrink:0;display:grid;gap:6px;padding:2px 8px 0}
.actsB{flex-shrink:0;display:grid;gap:6px;padding:6px 8px 0}
.a{height:70px;border:none;border-radius:13px;padding:0 4px;font-weight:700;font-size:.98rem;cursor:pointer;touch-action:manipulation;color:var(--text)}
.a.n{background:var(--action-bg);color:var(--action-text)}
.a.m{background:var(--ok);color:var(--okt)}
.a.f{background:var(--ko);color:var(--kot)}
.a.sel{background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent);transform:scale(.96)}
.action-fal,.action-per,.action-rob,.action-reb,.action-tap,.action-tm{--action-bg-color:var(--action-bg);--action-fg-color:var(--action-text)}
.color-info{--action-bg-color:var(--action-bg);--action-fg-color:var(--action-text)}
.color-azul{--action-bg-color:var(--palette-blue-bg);--action-fg-color:var(--palette-blue-text)}
.color-celeste{--action-bg-color:var(--palette-cyan-bg);--action-fg-color:var(--palette-cyan-text)}
.color-turquesa{--action-bg-color:var(--palette-teal-bg);--action-fg-color:var(--palette-teal-text)}
.color-verde{--action-bg-color:var(--palette-green-bg);--action-fg-color:var(--palette-green-text)}
.color-lima{--action-bg-color:var(--palette-lime-bg);--action-fg-color:var(--palette-lime-text)}
.color-amarillo{--action-bg-color:var(--palette-yellow-bg);--action-fg-color:var(--palette-yellow-text)}
.color-naranja{--action-bg-color:var(--palette-orange-bg);--action-fg-color:var(--palette-orange-text)}
.color-coral{--action-bg-color:var(--palette-coral-bg);--action-fg-color:var(--palette-coral-text)}
.color-rojo{--action-bg-color:var(--palette-red-bg);--action-fg-color:var(--palette-red-text)}
.color-rosa{--action-bg-color:var(--palette-pink-bg);--action-fg-color:var(--palette-pink-text)}
.color-morado{--action-bg-color:var(--palette-purple-bg);--action-fg-color:var(--palette-purple-text)}
.color-lavanda{--action-bg-color:var(--palette-lavender-bg);--action-fg-color:var(--palette-lavender-text)}
.color-gris{--action-bg-color:var(--palette-gray-bg);--action-fg-color:var(--palette-gray-text)}
.color-marron{--action-bg-color:var(--palette-brown-bg);--action-fg-color:var(--palette-brown-text)}
.msg{flex-shrink:0;text-align:center;font-size:.82rem;padding:6px 8px;min-height:30px;color:var(--muted)}
.msg.sel{color:var(--accent);font-weight:700}
.msg.warn{color:var(--danger);font-weight:700}
.pkoverlay{position:fixed;inset:0;background:rgba(0,0,0,.52);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.pksheet{background:var(--card);width:100%;max-width:520px;border-radius:18px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto}
.pkhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:1.05rem;padding:6px 6px 12px}
.pkhead button{flex-shrink:0;border:none;background:none;color:var(--muted);font-size:1.4rem;padding:4px 8px;cursor:pointer;line-height:1}
.pktitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.pkbadge{font-weight:800;padding:5px 11px;border-radius:9px;font-size:.95rem;background:var(--btn);color:var(--text);white-space:nowrap}
.pkbadge.m{background:var(--ok);color:var(--okt)}
.pkbadge.f{background:var(--ko);color:var(--kot)}
.pksub{font-size:.78rem;color:var(--muted);font-weight:600}
.pkactlist{display:flex;flex-direction:column;gap:6px;padding:0 2px 8px}
.pkact{text-align:left;padding:13px 14px;border:none;border-radius:11px;font-weight:700;font-size:.9rem;cursor:pointer;background:var(--btn);color:var(--text)}
.pkactgroups{display:grid;gap:6px;padding:0 2px 8px}
.pkactgroups .pkactrow{display:grid;gap:6px}
.pkactgroups .pkact{text-align:center;height:72px;padding:0 4px;font-size:.98rem;min-width:0}
.pkact.n{background:var(--action-bg);color:var(--action-text)}
.pkact.m{background:var(--ok);color:var(--okt)}
.pkact.f{background:var(--ko);color:var(--kot)}
.a[class*="action-"],.timeout[class*="action-"],.pkact[class*="action-"],.pkbadge[class*="action-"],.ev .k[class*="action-"]{background:var(--action-bg-color);color:var(--action-fg-color)}
.pkact.selected{outline:3px solid var(--accent);outline-offset:1px}
.pksub2{font-weight:500;opacity:.8;font-size:.8rem}
.pl.pk{padding:0 2px 10px}
.pl.pk .p{height:78px}
.teams.pk{padding:0 2px 10px}
.pkextra{display:block;width:100%;min-height:62px;margin:0 2px;padding:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:13px;font-weight:700;font-size:1rem;cursor:pointer}
.pkextra.equipo{background:var(--accent);color:#fff;border-color:var(--accent)}
.pkextra.warn{background:var(--ko);color:var(--kot);border-color:transparent}
.pkfouls{display:grid;gap:8px;padding:0 2px 8px}
.pkfouls button{min-height:64px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);text-align:left;font:inherit;cursor:pointer}
.pkfouls button:first-child{min-height:76px;background:var(--accent);color:#fff;border-color:var(--accent)}
.pkfouls button.selected{outline:3px solid var(--accent);outline-offset:1px}
.pkfouls strong,.pkfouls small{display:block}
.pkfouls strong{font-size:.98rem}
.pkfouls small{margin-top:3px;font-size:.73rem;opacity:.82}
@media (min-width:700px){
  .pkoverlay{padding:24px}
  .pksheet{max-width:1000px;max-height:90dvh;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px))}
  .pkactgroups,.pkactlist{gap:10px}
  .pkactgroups .pkactrow{gap:10px}
  .pkactgroups .pkact{height:88px;font-size:1.1rem}
  .pkactlist .pkact{padding:20px;font-size:1.05rem}
  .pl.pk{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px}
  .pl.pk .p{height:90px}
  .teams.pk{gap:10px}
  .teams.pk button{height:78px;font-size:1.1rem}
  .pkextra{min-height:70px;font-size:1.1rem}
}
.bat{display:flex;gap:2px;margin-top:4px}
.bat i{width:8px;height:6px;border-radius:1.5px;background:var(--line);display:block;font-style:normal}
.bat i.on{background:var(--accent)}
.bat i.on.over{background:var(--danger)}
.pbat{display:flex;gap:2px;margin-left:4px}
.pbat i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.pbat i.on{background:var(--accent)}
.pbat i.on.over{background:var(--danger)}
.roster{flex-shrink:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:7px;padding:0 8px 8px;pointer-events:none}
.roster.interactive{pointer-events:auto}
.p.ro{cursor:default;justify-content:center}
.p.ro .pts{font-size:.62rem;font-weight:500;color:var(--muted);margin-top:3px}
.p.ro.action-player{cursor:pointer}
.p.ro.action-player:disabled{opacity:.48;cursor:not-allowed}
.p.ro.action-player:disabled:active{background:var(--card);color:var(--text)}
.player-out{margin-top:3px;color:var(--danger);font-size:.52rem;font-weight:800;text-transform:uppercase}
.pl{flex-shrink:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:7px;padding:0 8px 8px}
.p{height:76px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.4rem;line-height:1;cursor:pointer;touch-action:manipulation;padding:0}
.p small{font-size:.66rem;font-weight:500;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;white-space:normal;line-height:1.1;margin-top:3px}
.p.ro small,.pl.pk .p small{color:var(--accent);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.p.ro small{color:var(--accent)}
.p small.alias{font-size:.56rem;letter-spacing:0;white-space:nowrap;overflow-wrap:normal;text-overflow:clip}
.p.rdy{border:2px solid var(--accent)}
.pl.pk .p.selected{border:3px solid var(--accent);background:var(--btn)}
.p:active{background:var(--accent);color:#fff}
.teams{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px 10px}
.teams button{height:68px;border:none;border-radius:13px;font-weight:800;font-size:1rem;cursor:pointer;touch-action:manipulation;color:#fff}
.teams .tus{background:var(--accent)}
.teams .triv{background:var(--riv)}
.teams button.rdy{box-shadow:0 0 0 3px var(--text)}
.teams.pk .tus.selected{box-shadow:0 0 0 3px var(--riv)}
.teams.pk .triv.selected{box-shadow:0 0 0 3px var(--accent)}
.teams button:active{filter:brightness(.85)}
.logh{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;padding:2px 12px}
.log-title{text-transform:none}
.log{flex:1;min-height:110px;overflow:auto;margin:0 8px 8px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.log-screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.log-fullhead{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px}
.log-screen .log{min-height:0}
.log-screen .ev{padding:11px 10px;font-size:.95rem}
.log-screen .ev .n,.log-screen .ev .q{font-size:.75rem}
.log-screen .ev .k{font-size:.82rem}
.log-screen .ev .btns button{padding:8px 10px}
.log-expand{flex:0 0 38px;min-width:38px;min-height:38px;border:none;font-size:.95rem}
.period-wizard-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;padding:2px}
.period-wizard-option{min-height:64px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-size:1.05rem;font-weight:800;cursor:pointer}
.period-wizard-option.selected{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.period-wizard-option:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ev-period{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--btn);color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-top:2px solid var(--accent);border-bottom:1px solid var(--line)}
.ev-period:after{content:"";height:1px;flex:1;background:var(--line)}
.empty{color:var(--muted);text-align:center;padding:20px;font-size:.85rem}
.ev{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 6px 7px 10px;border-bottom:1px solid var(--line);font-size:.85rem}
.ev .info{display:flex;align-items:center;gap:6px;min-width:0;flex:1;overflow:hidden}
.ev .n{flex-shrink:0;color:var(--muted);font-size:.7rem}
.ev .q{flex-shrink:0;color:var(--muted);font-size:.62rem;border:1px solid var(--line);border-radius:6px;padding:2px 5px}

.pg{flex:1;min-height:0;padding:8px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}

.ck{display:flex;gap:10px;align-items:center;font-size:.9rem;padding:6px 2px}

.seg button{flex:1;padding:10px 6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;font-size:.85rem;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
table{width:100%;table-layout:fixed;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:.78rem}
th,td{padding:8px 2px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:.6rem;color:var(--muted);text-transform:uppercase}
td:first-child,th:first-child{text-align:left;padding-left:6px;overflow-wrap:anywhere;font-weight:600}
td.pt{font-weight:800;color:var(--accent)}
.rebcell small{display:block;font-size:.55rem;color:var(--muted);white-space:nowrap}
tr.tot td{font-weight:800;background:var(--btn)}
tr.tot td:first-child{border-left:3px solid var(--accent)}
tr.player-row.even td{background:var(--bg)}
tr.player-row.odd td{background:var(--card)}

tr.riv td:first-child{border-left:3px solid var(--riv)}

.leg{font-size:.7rem;color:var(--muted)}
.ex{display:flex;gap:8px}
.ex .tb{flex:1;padding:12px;font-size:.85rem}
.iconbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font-size:1rem;cursor:pointer;touch-action:manipulation}
.iconbtn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.roster-actions{display:flex;align-items:center;gap:8px;margin:8px 0}
.roster-actions .add-player{margin-left:auto}
.action-tip{position:fixed;z-index:100;max-width:calc(100vw - 16px);padding:6px 9px;border-radius:7px;background:var(--text);color:var(--bg);font-size:.72rem;font-weight:600;line-height:1.2;text-align:center;white-space:normal;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.iconbtn:disabled{opacity:.4;cursor:default}
.ex.icon-actions{align-items:center;gap:10px}
.ex.icon-actions .iconbtn{flex:0 0 44px}
.tlist{flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:10px}
.trow{display:flex;flex-direction:column;gap:8px;padding:11px 8px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow .tname{font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tname small{display:block;font-weight:500;color:var(--accent);font-size:.65rem}
.trow .tbtns{display:flex;gap:6px;flex-wrap:wrap}
.trow .tbtns button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:11px 4px;font-size:.82rem;font-weight:700;cursor:pointer}
.trow .tbtns .iconbtn{flex:0 0 44px;padding:0;font-size:.95rem}
.trow .tbtns .iconbtn.dg{color:var(--danger)}
.trow .tbtns .iconbtn.load{background:var(--accent);color:#fff;border-color:var(--accent)}
.tnameinput{font:inherit;font-weight:700;font-size:1rem;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);width:100%}
.namefield{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600}
.color-settings{display:flex;flex-direction:column;gap:8px}
.color-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:5px 2px;font-size:.9rem}
.color-row select{min-width:150px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
.action-settings{display:flex;flex-direction:column;gap:6px}
.action-setting{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:3px 0}
.action-setting.dragging{opacity:.55}
.action-setting .ck{flex:1;min-width:0;padding:6px 2px}
.drag-handle{flex:0 0 32px;display:grid;place-items:center;height:36px;color:var(--muted);font-size:1.25rem;cursor:grab;touch-action:none;user-select:none}
.drag-handle:active{cursor:grabbing}
.order-controls{display:flex;gap:4px}
.order-controls button{width:38px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:1rem;cursor:pointer}
.order-controls button:disabled{opacity:.4;cursor:default}
</style>

<body>
<div id="app"></div>
<script>
var KEY="bball-log-v2",OLDKEY="bball-log-v1";
var ACT=[
 {id:"fal",l:"Falta",k:"n",grp:"fal",cat:"Falta",sub:""},
 {id:"per",l:"Pérdida",k:"n",grp:"per",cat:"Pérdida",sub:""},
 {id:"rob",l:"Robo",k:"n",grp:"rob",cat:"Robo",sub:""},
 {id:"tap",l:"Tapón",k:"n",grp:"tap",cat:"Tapón",sub:""},
 {id:"reb",l:"Rebote",k:"n",grp:"reb",cat:"Rebote",sub:""},
 {id:"l1",l:"T. libre ✓",k:"m",grp:"lib",cat:"Tiro libre",sub:"✓ acierto"},
 {id:"d1",l:"Tiro 2 ✓",k:"m",grp:"d2",cat:"Tiro de 2",sub:"✓ acierto"},
 {id:"t1",l:"Tiro 3 ✓",k:"m",grp:"t3",cat:"Tiro de 3",sub:"✓ acierto"},
 {id:"l0",l:"T. libre ✗",k:"f",grp:"lib",cat:"Tiro libre",sub:"✗ fallo"},
 {id:"d0",l:"Tiro 2 ✗",k:"f",grp:"d2",cat:"Tiro de 2",sub:"✗ fallo"},
 {id:"t0",l:"Tiro 3 ✗",k:"f",grp:"t3",cat:"Tiro de 3",sub:"✗ fallo"},
 {id:"tm",l:"Tiempo muerto",k:"n",grp:"tm",cat:"Tiempo muerto",sub:""}
];
var FOUL_TYPES=[
 {id:"normal",label:"Normal, disruptiva o técnica tipo 2",detail:"Lo habitual"},
 {id:"circle",label:"Flagrante o técnica tipo 1",detail:"Con circulito"},
 {id:"disqualifying",label:"Descalificante",detail:"Descalificación directa"}
];
var GROUPS=[{id:"fal",l:"Falta"},{id:"per",l:"Pérdida"},{id:"rob",l:"Robo"},{id:"tap",l:"Tapón"},{id:"reb",l:"Rebote"},{id:"lib",l:"Tiro libre"},{id:"d2",l:"Tiro de 2"},{id:"t3",l:"Tiro de 3"}];
var ORDERABLE_ACTIONS=GROUPS.filter(function(g){return g.id!=="lib"&&g.id!=="d2"&&g.id!=="t3";});
var COLOR_ACTIONS=GROUPS.filter(function(g){return g.id!=="lib"&&g.id!=="d2"&&g.id!=="t3";}).concat([{id:"tm",l:"Tiempo muerto"}]);
var COLOR_OPTIONS=[{id:"info",l:"Por defecto"},{id:"azul",l:"Azul"},{id:"celeste",l:"Celeste"},{id:"turquesa",l:"Turquesa"},{id:"verde",l:"Verde"},{id:"lima",l:"Lima"},{id:"amarillo",l:"Amarillo"},{id:"naranja",l:"Naranja"},{id:"coral",l:"Coral"},{id:"rojo",l:"Rojo"},{id:"rosa",l:"Rosa"},{id:"morado",l:"Morado"},{id:"lavanda",l:"Lavanda"},{id:"gris",l:"Gris"},{id:"marron",l:"Marrón"}];
var LEGACY_COLOR_HEX={info:"#cff4fc",azul:"#dbeafe",celeste:"#cffafe",turquesa:"#ccfbf1",verde:"#dcfce7",lima:"#ecfccb",amarillo:"#fef3c7",naranja:"#ffedd5",coral:"#ffe4e1",rojo:"#fee2e2",rosa:"#fce7f3",morado:"#f3e8ff",lavanda:"#ede9fe",gris:"#e5e7eb",marron:"#f0e2d3"};
function act(id){return ACT.filter(function(a){return a.id===id;})[0];}
var DEFAULT_PLAYERS=12,MAX_ALIAS_LENGTH=8;
var S={players:[],events:[],teams:[],activeTeam:null,editTeamId:null,customTeamPeriodInput:false,enabled:{fal:1,per:1,rob:1,tap:1,reb:1,lib:1,d2:1,t3:1},askReboundAfterMiss:true,actionOrder:ORDERABLE_ACTIONS.map(function(a){return a.id;}),actionColors:{},playerActionMode:true,periods:4,customPeriodInput:false,period:1,summaryPeriods:null,summaryHideInactive:false,home:true,clubName:"Nosotros",opponentName:"Rival",theme:"system",picker:null,view:"main",logExpanded:false,msg:"",warn:false};
var seq=0;
function uid(){seq++;return Date.now().toString(36)+seq;}
function normalizePlayers(players){
  var list=Array.isArray(players)?players.slice():[];
  if(!list.length){
    list=Array.from({length:DEFAULT_PLAYERS},function(_,i){return {id:uid(),num:String(i+1),name:"",alias:""};});
    return sortPlayersList(list);
  }
  list=list.slice(0,DEFAULT_PLAYERS).map(function(p,i){return {id:p&&p.id?String(p.id):uid(),num:(p&&p.num!==undefined&&p.num!==null&&String(p.num).trim()!=="")?String(p.num):String(i+1),name:p&&p.name!==undefined?String(p.name):"",alias:p&&typeof p.alias==="string"?p.alias.slice(0,MAX_ALIAS_LENGTH):""};});
  return sortPlayersList(list);
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function normalizeActionColors(colors){
  var normalized={};
  if(!colors||typeof colors!=="object")return normalized;
  COLOR_ACTIONS.forEach(function(action){
    var color=colors[action.id];
    if(typeof color==="string"&&COLOR_OPTIONS.some(function(option){return option.id===color;}))normalized[action.id]=color;
    else if(typeof color==="string"&&/^#[0-9a-fA-F]{6}$/.test(color)){
      var rgb=color.slice(1).match(/.{2}/g).map(function(channel){return parseInt(channel,16);});
      var closest=COLOR_OPTIONS.reduce(function(best,option){
        var sample=LEGACY_COLOR_HEX[option.id].slice(1).match(/.{2}/g).map(function(channel){return parseInt(channel,16);});
        var distance=Math.pow(rgb[0]-sample[0],2)+Math.pow(rgb[1]-sample[1],2)+Math.pow(rgb[2]-sample[2],2);
        return distance<best.distance?{id:option.id,distance:distance}:best;
      },{id:"info",distance:Infinity});
      normalized[action.id]=closest.id;
    }
  });
  return normalized;
}
function actionColorClass(id){return " color-"+(S.actionColors[id]||"info");}
function normalizeActionOrder(order){
  var valid=ORDERABLE_ACTIONS.map(function(a){return a.id;}),normalized=[];
  if(Array.isArray(order))order.forEach(function(id){if(valid.indexOf(id)!==-1&&normalized.indexOf(id)===-1)normalized.push(id);});
  valid.forEach(function(id){if(normalized.indexOf(id)===-1)normalized.push(id);});
  return normalized;
}
function orderedActions(actions){
  var order=normalizeActionOrder(S.actionOrder);
  return actions.slice().sort(function(a,b){return order.indexOf(a.id)-order.indexOf(b.id);});
}
function setActionOrderFromRows(container){
  S.actionOrder=Array.prototype.map.call(container.querySelectorAll("[data-order-row]"),function(row){return row.dataset.orderRow;});
}
function moveAction(id,direction){
  var order=normalizeActionOrder(S.actionOrder),index=order.indexOf(id),target=index+direction;
  if(index<0||target<0||target>=order.length)return;
  order.splice(index,1);order.splice(target,0,id);S.actionOrder=order;save();render();
}
function resetSettings(){
  var enabled={};
  GROUPS.forEach(function(group){enabled[group.id]=1;});
  var maxRecordedPeriod=4;
  S.events.forEach(function(event){if(event.q>maxRecordedPeriod)maxRecordedPeriod=Math.min(8,event.q);});
  S.enabled=enabled;
  S.askReboundAfterMiss=true;
  S.actionOrder=ORDERABLE_ACTIONS.map(function(action){return action.id;});
  S.actionColors={};
  S.playerActionMode=true;
  S.periods=maxRecordedPeriod;
  S.period=1;
  S.summaryPeriods=null;
  S.home=true;
  S.clubName="Nosotros";
  S.opponentName="Rival";
  S.theme="system";
  S.picker=null;
  setTheme("system");
  save();
  render();
}
function lab(p){return p.num!==""?p.num:(p.name?p.name.charAt(0).toUpperCase():"?");}
function playerAlias(p){return typeof p.alias==="string"?p.alias.trim():"";}
function playerDisplayName(p){return playerAlias(p)||p.name;}
function playerNameMarkup(p){var alias=playerAlias(p),display=alias||p.name;return display?'<small'+(alias?' class="alias"':'')+'>'+esc(display)+'</small>':"";}
function who(p){return p?((p.num!==""?"#"+p.num:"")+(p.name?" "+p.name:"")||"?"):"(eliminado)";}
function pl(id){return S.players.filter(function(p){return p.id===id;})[0];}
function isNum(v){return v!==""&&!isNaN(v);}
function playerNumberForSort(num){
  var value=String(num===undefined||num===null?"":num).trim();
  return value==="00"?100:parseFloat(value);
}
function sortPlayersList(players){
  var list=Array.isArray(players)?players.slice():[];
  return list.sort(function(a,b){
    var an=String(a&&a.num!==undefined&&a.num!==null?a.num:"" ).trim();
    var bn=String(b&&b.num!==undefined&&b.num!==null?b.num:"" ).trim();
    var af=an===""?Number.MAX_SAFE_INTEGER:playerNumberForSort(an);
    var bf=bn===""?Number.MAX_SAFE_INTEGER:playerNumberForSort(bn);
    if(isNaN(af)&&isNaN(bf))return String(a&&a.name||"").localeCompare(String(b&&b.name||""),"es",{sensitivity:"base"});
    if(isNaN(af))return 1;
    if(isNaN(bf))return -1;
    if(af===bf)return String(a&&a.name||"").localeCompare(String(b&&b.name||""),"es",{sensitivity:"base"});
    return af-bf;
  });
}
function timeoutsInHalf(side,period){
  var halfEnd=Math.ceil(S.periods/2),firstHalf=period<=halfEnd;
  var start=firstHalf?1:halfEnd+1,end=firstHalf?halfEnd:S.periods;
  return S.events.filter(function(e){var q=e.q||1;return e.a==="tm"&&e.side===side&&q>=start&&q<=end;}).length;
}
function sortedPlayers(){
  var withIdx=S.players.map(function(p,i){return {p:p,i:i};});
  withIdx.sort(function(a,b){
    var an=isNum(a.p.num),bn=isNum(b.p.num);
    if(an&&bn)return playerNumberForSort(a.p.num)-playerNumberForSort(b.p.num);
    if(an&&!bn)return -1;
    if(!an&&bn)return 1;
    return a.i-b.i;
  });
  return withIdx.map(function(x){return x.p;});
}
function whoLbl(side,p){if(side==="rival")return "Rival";return p?who(pl(p)):"Equipo";}
function logActorLabel(event){
  if(event.p)return whoLbl(event.side,event.p);
  return event.side==="rival"?S.opponentName.trim()||"Rival":S.clubName.trim()||"Nosotros";
}
function foulsOf(pid){return S.events.filter(function(e){return e.side==="us"&&e.p===pid&&e.a==="fal";}).length;}
function foulTypeOf(event){return FOUL_TYPES.some(function(type){return type.id===event.foulType;})?event.foulType:"normal";}
function foulTypeLabel(typeId){return FOUL_TYPES.filter(function(type){return type.id===typeId;})[0].label;}
function isPlayerDisqualified(pid){
  var fouls=S.events.filter(function(e){return e.side==="us"&&e.p===pid&&e.a==="fal";});
  return fouls.length>=5||fouls.filter(function(e){return foulTypeOf(e)==="circle";}).length>=2||
    fouls.some(function(e){return foulTypeOf(e)==="disqualifying";});
}
function foulsInPeriod(side,q){return S.events.filter(function(e){return e.side===side&&e.a==="fal"&&(e.q||1)===q;}).length;}
function ptsOf(pid){
  var t=0;
  S.events.forEach(function(e){if(e.side==="us"&&e.p===pid){if(e.a==="l1")t+=1;else if(e.a==="d1")t+=2;else if(e.a==="t1")t+=3;}});
  return t;
}
function evLabel(e){
  if(e.a==="reb"&&e.off!==undefined)return "Rebote "+(e.off?"ofensivo":"defensivo");
  if(e.a==="fal"&&e.side==="us"&&e.p&&foulTypeOf(e)==="circle")return "○ Falta · "+foulTypeLabel(foulTypeOf(e));
  if(e.a==="fal"&&e.side==="us"&&e.p)return "Falta · "+foulTypeLabel(foulTypeOf(e));
  if(e.a==="fal")return "Falta";
  return act(e.a).l;
}
function badge(text,k,actionId){return '<span class="pkbadge '+(k||"n")+(actionId?" action-"+actionId+actionColorClass(actionId):"")+'">'+esc(text)+'</span>';}
function subTitle(a){return badge(a.cat,a.k,a.k==="n"?a.id:null)+(a.sub?'<span class="pksub">'+esc(a.sub)+'</span>':"");}
function battery(n,cls,max){
  max=max||5;
  var c=cls||"bat";
  return '<span class="'+c+'">'+Array.from({length:max},function(_,i){return '<i class="'+(i<n?"on"+(n>=max?" over":""):"")+'"></i>';}).join("")+'</span>';
}
function selectablePlayers(){return sortedPlayers().filter(function(p){return !isPlayerDisqualified(p.id);});}
function playerActions(){
  var general=ACT.filter(function(a){return ORDERABLE_ACTIONS.some(function(g){return g.id===a.grp;})&&S.enabled[a.grp];});
  var shots=ACT.filter(function(a){return (a.k==="m"||a.k==="f")&&S.enabled[a.grp];});
  return orderedActions(general).concat(shots);
}
function applyLoaded(d){
  var reboundEnabled=!!(d.enabled&&("reb" in d.enabled)?d.enabled.reb:true);
  S.players=normalizePlayers(d.players||[]);S.events=d.events||[];
  S.actionColors=normalizeActionColors(d.actionColors);
  S.actionOrder=normalizeActionOrder(d.actionOrder);
  S.playerActionMode=d.playerActionMode===undefined?true:d.playerActionMode===true;
  S.periods=d.periods||4;S.period=Math.min(d.period||1,S.periods);
  S.summaryPeriods=null;
  S.home=d.home===undefined?true:!!d.home;
  S.clubName=d.clubName===undefined?"Nosotros":String(d.clubName);
  S.opponentName=d.opponentName===undefined?"Rival":String(d.opponentName);
  if(!d.enabled||!("tap" in d.enabled))S.enabled.tap=1;
  if(d.enabled)for(var k in S.enabled)if(k in d.enabled)S.enabled[k]=!!d.enabled[k];
  if(d.showReboundButton===false)S.enabled.reb=0;
  S.askReboundAfterMiss=d.askReboundAfterMiss===undefined?reboundEnabled:d.askReboundAfterMiss===true;
  S.teams=(d.teams||[]).map(function(t){if(!t)return t;var team={id:t.id,name:t.name,periods:Number.isInteger(t.periods)&&t.periods>=1&&t.periods<=8?t.periods:null,players:sortPlayersList((Array.isArray(t.players)?t.players:[]).map(function(p){return {id:p.id,num:p.num,name:p.name,alias:typeof p.alias==="string"?p.alias.slice(0,MAX_ALIAS_LENGTH):""};}))};return team;});
  S.activeTeam=d.activeTeam||null;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.players&&d.players.length){applyLoaded(d);return;}}}catch(e){}
  try{
    var r1=localStorage.getItem(OLDKEY);
    if(r1){var d1=JSON.parse(r1);
      if(d1&&d1.players&&d1.players.length){
        var events=(d1.events||[]).map(function(e){return {id:e.id||uid(),side:"us",p:e.p==="team"?null:e.p,a:e.a,q:e.q||1};});
        applyLoaded({players:d1.players,events:events,periods:d1.periods||4,period:d1.period||1,home:true});
        save();return;
      }
    }
  }catch(e){}
  S.players=normalizePlayers([]);
}
function save(){
  S.players=sortPlayersList(S.players);
  S.teams=(S.teams||[]).map(function(t){if(!t)return t; t.players=sortPlayersList(Array.isArray(t.players)?t.players:[]); return t;});
  try{localStorage.setItem(KEY,JSON.stringify({players:S.players,events:S.events,teams:S.teams,activeTeam:S.activeTeam,enabled:S.enabled,askReboundAfterMiss:S.askReboundAfterMiss,actionOrder:S.actionOrder,actionColors:S.actionColors,playerActionMode:S.playerActionMode,periods:S.periods,period:S.period,home:S.home,clubName:S.clubName,opponentName:S.opponentName}));}catch(e){}
}
function blankRoster(){return normalizePlayers([]);}

function scoreOf(side){var t=0;S.events.forEach(function(e){if(e.side!==side)return;if(e.a==="l1")t+=1;else if(e.a==="d1")t+=2;else if(e.a==="t1")t+=3;});return t;}

      }).join("");
    }
    if(o.actionGrid){
      var general=o.actions.filter(function(a){return a.k==="n";});

      h+='<div class="pkactgroups">';
      if(general.length)h+='<div class="pkactrow" style="grid-template-columns:repeat('+general.length+',minmax(0,1fr))">'+actionButtons(general)+'</div>';
      if(made.length||missed.length)h+='<div class="pkactrow" style="grid-template-columns:repeat('+Math.max(made.length,missed.length)+',minmax(0,1fr))">'+actionButtons(made.concat(missed))+'</div>';
      h+='</div>';
    }else h+='<div class="pkactlist">'+actionButtons(o.actions)+'</div>';
  }else{
    var plist=o.allPlayers?sortedPlayers():selectablePlayers();
    if(o.players!==false&&plist.length)h+='<div class="pl pk">'+plist.map(function(p){

    }).join("")+'</div>';

      h+='<div class="teams pk"><button class="tus'+(o.selectedSide==="us"&&!o.selectedPlayer?" selected":"")+'" data-pks="us" data-pkp="">Equipo</button>';

function startAction(id){
  var a=act(id);
  var titleHtml=id==="tap"?badge(a.cat,a.k,a.id)+'<span class="pksub">¿Quién realiza el tapón?</span>':subTitle(a);

function startPlayerAction(playerId){

function startEdit(evId){
  var ev=S.events.filter(function(v){return v.id===evId;})[0];if(!ev)return;
  openPicker({
    titleHtml:badge("Editar","n")+'<span class="pksub">Primero, elige el cuarto o tiempo</span>',

function openEditDetails(ev){
  if(ev.a==="tm"){
    openPicker({
      titleHtml:subTitle(act("tm")),
      players:false,
      teamRow:true,
      rival:true,
      selectedSide:ev.side,
      onPick:function(side){
        ev.side=side;ev.p=null;save();
        flash("✔ Tiempo muerto · "+(side==="us"?S.clubName.trim()||"Nosotros":S.opponentName.trim()||"Rival"));
      }
    });
    return;
  }
  openPicker({
    titleHtml:badge("Editar","n")+'<span class="pksub">Selecciona una acción</span>',
    actions:ACT.filter(function(a){return S.enabled[a.grp]||a.id===ev.a;}),
    actionGrid:true,
    selectedAction:ev.a,
    onPickAction:function(newId){
      var a=act(newId);
      openPicker({
        titleHtml:subTitle(a),teamRow:true,rival:true,extra:"Cancelar",allPlayers:true,
        selectedSide:ev.side,selectedPlayer:ev.p,
        onPick:function(side,p){
          function applyEdit(foulType){
            ev.a=newId;ev.side=side;ev.p=p;delete ev.pairId;
            if(newId==="fal"&&side==="us"&&p)ev.foulType=foulType;
            else delete ev.foulType;
            if(newId!=="reb"){delete ev.off;delete ev.missedSide;}
            else if(ev.missedSide)ev.off=side===ev.missedSide;
            save();flash("✔ Editado · "+a.cat+" · "+whoLbl(side,p));
          }
          if(newId==="fal"&&side==="us"&&p){
            openFoulTypePicker(function(foulType){applyEdit(foulType);},foulTypeOf(ev));
            return;
          }
          applyEdit(null);
        },
        onCancel:function(){}
      });
    }
  });
}
function finalizeAction(id,side,p){
  var a=act(id);
  if(navigator.vibrate){try{navigator.vibrate(20);}catch(x){}}
  if(id==="tap"){
    var tapPairId=uid();
    S.events.push({id:uid(),side:side,p:p,a:"tap",q:S.period,pairId:tapPairId});
    if(!S.enabled.per){
      save();flash("✔ "+a.l+" · "+whoLbl(side,p));return;
    }
    save();
    openPicker({
      titleHtml:badge("Tapón","n","tap")+'<span class="pksub">¿Quién recupera el balón? Solo hay pérdida si lo recupera quien hizo el tapón.</span>',
      players:false,teamRow:true,rival:true,extra:"Sin pérdida",
      onPick:function(recoverySide){
        var turnoverSide=turnoverSideAfterBlock(side,recoverySide);
        if(turnoverSide==="us"&&selectablePlayers().length){
          save();
          openPicker({
            titleHtml:badge("Pérdida","n","per")+'<span class="pksub">¿Qué jugador recibió el tapón?</span>',
            teamRow:false,extra:"Equipo",
            onPick:function(lostSide,lostPlayer){
              S.events.push({id:uid(),side:"us",p:lostPlayer,a:"per",q:S.period,pairId:tapPairId});
              save();flash("✔ Tapón · "+whoLbl(side,p)+" · Pérdida de "+whoLbl("us",lostPlayer));
            },
            onCancel:function(){
              S.events.push({id:uid(),side:"us",p:null,a:"per",q:S.period,pairId:tapPairId});
              save();flash("✔ Tapón · "+whoLbl(side,p)+" · Pérdida de "+(S.clubName.trim()||"Nosotros"));
            }
          });
          return;
        }
        if(turnoverSide)S.events.push({id:uid(),side:turnoverSide,p:null,a:"per",q:S.period,pairId:tapPairId});
        save();
        flash("✔ Tapón · "+whoLbl(side,p)+(turnoverSide?" · Pérdida de "+(turnoverSide==="us"?S.clubName.trim()||"Nosotros":S.opponentName.trim()||"Rival"):" · Recupera "+(recoverySide==="us"?S.clubName.trim()||"Nosotros":S.opponentName.trim()||"Rival")));
      },
      onCancel:function(){}
    });
    return;
  }
  if(id==="rob"){
    var pairId=uid(),oppSide=side==="us"?"rival":"us";
    S.events.push({id:uid(),side:side,p:p,a:"rob",q:S.period,pairId:pairId});
    if(!S.enabled.per){
      save();flash("✔ "+a.l+" · "+whoLbl(side,p));return;
    }
    if(oppSide==="rival"){
      S.events.push({id:uid(),side:"rival",p:null,a:"per",q:S.period,pairId:pairId});
      save();flash("✔ "+a.l+" · "+whoLbl(side,p)+" · Pérdida automática al rival");
    }else{
      save();flash("✔ "+a.l+" · "+whoLbl(side,p));
      if(!selectablePlayers().length){
        S.events.push({id:uid(),side:"us",p:null,a:"per",q:S.period,pairId:pairId});save();
      }else{
        openPicker({
          titleHtml:badge("Pérdida","n","per")+'<span class="pksub">¿quién la perdió?</span>',teamRow:false,extra:"Equipo",
          onPick:function(side2,p2){S.events.push({id:uid(),side:"us",p:p2,a:"per",q:S.period,pairId:pairId});save();},
          onCancel:function(){S.events.push({id:uid(),side:"us",p:null,a:"per",q:S.period,pairId:pairId});save();}
        });
      }
    }
    return;
  }
  if(id==="fal"&&side==="us"&&p){
    openFoulTypePicker(function(foulType){
      S.events.push({id:uid(),side:side,p:p,a:id,q:S.period,foulType:foulType});
      save();flash("✔ "+(foulType==="normal"?"Falta":"Falta · "+foulTypeLabel(foulType))+" · "+whoLbl(side,p));
    });
    return;
  }
  S.events.push({id:uid(),side:side,p:p,a:id,q:S.period});
  save();
  flash("✔ "+a.l+" · "+whoLbl(side,p));
  if((id==="l0"||id==="d0"||id==="t0")&&S.askReboundAfterMiss){
    openPicker({
      titleHtml:badge("Rebote","n","reb")+'<span class="pksub">¿quién lo coge?</span>',teamRow:true,rival:true,extra:"No hay rebote",
      onPick:function(side3,p3){
        var off=side3===side;
        S.events.push({id:uid(),side:side3,p:p3,a:"reb",q:S.period,off:off,missedSide:side});save();
        flash("✔ Rebote "+(off?"ofensivo":"defensivo")+" · "+whoLbl(side3,p3));
      },
      onCancel:function(){}
    });
  }
}
function render(){
  var scrollState={x:window.scrollX,y:window.scrollY,containers:[]};
  [".pg",".log",".pksheet"].forEach(function(selector){
    document.querySelectorAll(selector).forEach(function(element,index){
      scrollState.containers.push({selector:selector,index:index,left:element.scrollLeft,top:element.scrollTop});
    });
  });
  var h="";
  if(S.view==="main"&&S.logExpanded)h=renderLog(true);
  else if(S.view==="set")h=setView();else if(S.view==="sum")h=sumView();else if(S.view==="teams")h=teamsView();else if(S.view==="team")h=teamView();else h=mainView();
  h+=renderPicker();
  document.getElementById("app").innerHTML=h;
  window.scrollTo(scrollState.x,scrollState.y);
  scrollState.containers.forEach(function(position){
    var element=document.querySelectorAll(position.selector)[position.index];
    if(element){element.scrollLeft=position.left;element.scrollTop=position.top;}
  });
}

function renderLog(fullscreen){
  var h=fullscreen?'<div class="log-screen"><header class="log-fullhead"><h1>Registros ('+S.events.length+')</h1><button type="button" class="iconbtn log-expand" data-logtoggle="1" aria-label="Volver al partido" title="Volver al partido"><i class="fa-solid fa-compress" aria-hidden="true"></i></button></header><div class="log">':'<div class="logh"><span class="log-title">Registros ('+S.events.length+')</span><button type="button" class="iconbtn log-expand" data-logtoggle="1" aria-label="Ampliar registro a pantalla completa" title="Ampliar registro a pantalla completa"><i class="fa-solid fa-expand" aria-hidden="true"></i></button></div><div class="log">';
  if(!S.events.length)h+='<div class="empty">Aún no hay acciones registradas</div>';
  var previousPeriod=null;
  S.events.map(function(e,index){return {event:e,index:index};}).sort(function(a,b){
    var periodB=Number(b.event.q)||1,periodA=Number(a.event.q)||1;
    return periodB-periodA||b.index-a.index;
  }).forEach(function(item){
    var e=item.event;

      h+='<div class="ev-period">'+(S.periods<=4?"Cuarto ":"Tiempo ")+period+'</div>';

  });
  return h+'</div>'+(fullscreen?'</div>':"");
}

function empty(){return {fal:0,per:0,rob:0,tap:0,reb:0,rebOff:0,rebDef:0,l1:0,l0:0,d1:0,d0:0,t1:0,t0:0};}
function countEvents(evs){
  var c=empty();
  evs.forEach(function(e){
    if(c[e.a]!==undefined)c[e.a]++;
    if(e.a==="reb"&&e.off!==undefined)c[e.off?"rebOff":"rebDef"]++;
  });
  return c;
}
function computeTable(evs){
  var rows=[],totC=empty(),totPt=0;
  var clubName=S.clubName.trim()||"Nosotros",opponentName=S.opponentName.trim()||"Rival";
  S.players.forEach(function(p,i){
    var c=countEvents(evs.filter(function(e){return e.side==="us"&&e.p===p.id;}));
    var pt=c.l1+2*c.d1+3*c.t1;
    rows.push({name:who(p),pt:pt,c:c,cls:"player-row "+(i%2?"odd":"even")});
    for(var k in c)totC[k]+=c[k];totPt+=pt;
  });
  var eqEvs=evs.filter(function(e){return e.side==="us"&&!e.p&&e.a!=="tm";});
  if(eqEvs.length){
    var ce=countEvents(eqEvs);
    var pte=ce.l1+2*ce.d1+3*ce.t1;
    rows.push({name:"Equipo",pt:pte,c:ce,cls:"player-row "+(S.players.length%2?"odd":"even")});
    for(var k in ce)totC[k]+=ce[k];totPt+=pte;
  }
  rows.push({name:clubName,pt:totPt,c:totC,cls:"tot"});
  var rivEvs=evs.filter(function(e){return e.side==="rival";});
  var cr=countEvents(rivEvs);
  var ptr=cr.l1+2*cr.d1+3*cr.t1;
  rows.push({name:opponentName,pt:ptr,c:cr,cls:"riv"});
  return rows;
}
function statTable(evs,title,hideInactive){
  var rows=computeTable(evs);
  if(hideInactive)rows=rows.filter(function(r){
    return r.cls.indexOf("player-row ")!==0||r.pt||r.c.fal||r.c.per||r.c.rob||r.c.tap||r.c.reb||r.c.l1||r.c.l0||r.c.d1||r.c.d0||r.c.t1||r.c.t0;
  });
  var body=rows.map(function(r){return '<tr class="'+r.cls+'"><td>'+esc(r.name)+'</td><td class="pt">'+r.pt+'</td><td>'+r.c.fal+'</td><td>'+r.c.per+'</td><td>'+r.c.rob+'</td><td>'+r.c.tap+'</td><td class="rebcell">'+r.c.reb+'<small>'+r.c.rebOff+'/'+r.c.rebDef+'</small></td><td>'+r.c.l1+'/'+(r.c.l1+r.c.l0)+'</td><td>'+r.c.d1+'/'+(r.c.d1+r.c.d0)+'</td><td>'+r.c.t1+'/'+(r.c.t1+r.c.t0)+'</td></tr>';}).join("");
  return (title?'<div class="sec">'+title+'</div>':"")+'<table><colgroup><col style="width:22%"><col style="width:7%"><col style="width:7%"><col style="width:8%"><col style="width:7%"><col style="width:7%"><col style="width:8%"><col style="width:11%"><col style="width:11%"><col style="width:12%"></colgroup><tr><th>Equipo/jugador</th><th>Pts</th><th>Fal</th><th>Pér</th><th>Rob</th><th>Tap</th><th>Reb<br><span style="font-size:.55rem">O/D</span></th><th>TL</th><th>T2</th><th>T3</th></tr>'+body+'</table><div class="leg">Rebotes: total arriba · ofensivos/defensivos abajo</div>';
}

function selectedSummaryPeriods(){

function summaryData(){
  var selected=selectedSummaryPeriods(),all=selected.length===S.periods;
  var label=S.periods<=4?"Cuarto ":"Tiempo ";

  if(!all){
    if(!selected.length)title="Sin periodos seleccionados";
    else if(selected.length===1)title=label+(S.periods<=4?"C":"T")+selected[0];
    else title=(S.periods<=4?"Cuartos ":"Tiempos ")+selected.map(function(n){return (S.periods<=4?"C":"T")+n;}).join(" + ");
  }
  return {title:title,events:S.events.filter(function(e){return selected.indexOf(e.q||1)!==-1;})};

function today(){var d=new Date();function z(n){return (n<10?"0":"")+n;}return {iso:d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())};}
function csvq(v){v=String(v);return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
async function saveFile(name,data,mime){
  try{
    if(window.claude&&window.claude.use){
      var dl=await window.claude.use("downloads");
      if(dl){await dl.save({filename:name,data:data});return;}
    }
  }catch(e){if(e&&(e.code==="declined"||e.code==="rate_limited"))return;}
  var blob=new Blob([data],{type:mime}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
}

  }};

function validMatchData(data){
  if(!data||data.format!=="basket-stats-match"||data.version!==1||!data.match)return false;
  var m=data.match,groupIds=GROUPS.map(function(g){return g.id;});
  function validId(id){return typeof id==="string"&&/^[A-Za-z0-9_-]+$/.test(id);}
  function validPlayers(players){
    if(!Array.isArray(players))return false;
    var ids={};
    return players.every(function(p){
      if(!p||!validId(p.id)||typeof p.num!=="string"||typeof p.name!=="string"||(p.alias!==undefined&&typeof p.alias!=="string")||ids[p.id])return false;
      ids[p.id]=true;return true;
    });
  }
  if(!validPlayers(m.players)||!Array.isArray(m.events))return false;
  if(m.playerActionMode!==undefined&&typeof m.playerActionMode!=="boolean")return false;
  if(m.askReboundAfterMiss!==undefined&&typeof m.askReboundAfterMiss!=="boolean")return false;
  if(!m.enabled||typeof m.enabled!=="object"||!groupIds.every(function(id){
    var value=m.enabled[id];
    return (id==="tap"&&value===undefined)||value===0||value===1||typeof value==="boolean";
  }))return false;
  if(m.actionColors!==undefined){
    if(!m.actionColors||typeof m.actionColors!=="object"||Array.isArray(m.actionColors))return false;
    if(!COLOR_ACTIONS.every(function(action){
      var color=m.actionColors[action.id];
      return color===undefined||(typeof color==="string"&&(COLOR_OPTIONS.some(function(option){return option.id===color;})||/^#[0-9a-fA-F]{6}$/.test(color)));
    }))return false;
  }
  if(m.actionOrder!==undefined&&(!Array.isArray(m.actionOrder)||!m.actionOrder.every(function(id,index){
    return ORDERABLE_ACTIONS.some(function(action){return action.id===id;})&&m.actionOrder.indexOf(id)===index;
  })))return false;
  if(typeof m.periods!=="number"||m.periods%1!==0||m.periods<1||m.periods>8||
    typeof m.period!=="number"||m.period%1!==0||m.period<1||m.period>m.periods||
    typeof m.home!=="boolean"||typeof m.clubName!=="string"||typeof m.opponentName!=="string")return false;
  var eventIds={};
  return m.events.every(function(e){
    if(!e||!validId(e.id)||eventIds[e.id]||
      (e.side!=="us"&&e.side!=="rival")||typeof e.a!=="string"||!act(e.a)||
      typeof e.q!=="number"||e.q%1!==0||e.q<1||e.q>8||
      (e.p!==undefined&&e.p!==null&&!validId(e.p)))return false;
    if(e.pairId!==undefined&&typeof e.pairId!=="string")return false;
    if(e.off!==undefined&&typeof e.off!=="boolean")return false;
    if(e.missedSide!==undefined&&e.missedSide!=="us"&&e.missedSide!=="rival")return false;
    if(e.foulType!==undefined&&(e.a!=="fal"||e.side!=="us"||!e.p||
      !FOUL_TYPES.some(function(type){return type.id===e.foulType;})))return false;
    eventIds[e.id]=true;return true;
  });
}
function importMatch(file){
  return file.text().then(function(text){
    var data;
    try{data=JSON.parse(text);}catch(e){alert("El archivo no contiene un JSON válido.");return;}
    if(!validMatchData(data)){
      alert("El archivo no contiene un partido completo compatible o tiene datos no válidos.");
      return;
    }
    if(!confirm("Se sustituirán el partido actual, sus jugadores, acciones y ajustes. Las plantillas guardadas en este dispositivo no se modificarán. ¿Continuar?"))return;
    var match=data.match;
    match.teams=S.teams;
    match.activeTeam=null;
    applyLoaded(match);
    S.summaryHideInactive=false;S.view="sum";S.picker=null;save();render();
    alert("Partido importado correctamente.");
  },function(){alert("No se pudo leer el archivo seleccionado.");});
}
function exportBackup(){
  var data={format:"basket-stats-backup",version:1,state:{
    players:S.players.map(function(p){return {id:p.id,num:p.num,name:p.name,alias:playerAlias(p)};}),
    events:S.events,
    teams:S.teams.map(function(t){return {id:t.id,name:t.name,periods:t.periods===undefined?null:t.periods,players:t.players.map(function(p){return {id:p.id,num:p.num,name:p.name,alias:playerAlias(p)};})};}),
    activeTeam:S.activeTeam,
    enabled:S.enabled,askReboundAfterMiss:S.askReboundAfterMiss,actionOrder:S.actionOrder,actionColors:S.actionColors,playerActionMode:S.playerActionMode,periods:S.periods,period:S.period,
    home:S.home,clubName:S.clubName,opponentName:S.opponentName,theme:S.theme
  }};
  return saveFile("respaldo-baloncesto-"+today().iso+".json",JSON.stringify(data,null,2),"application/json;charset=utf-8");
}
function validBackupData(data){
  if(!data||data.format!=="basket-stats-backup"||data.version!==1||!data.state)return false;
  var state=data.state;
  if(!validMatchData({format:"basket-stats-match",version:1,match:state})||
    !Array.isArray(state.teams)||["system","light","dark"].indexOf(state.theme)===-1)return false;
  function validId(id){return typeof id==="string"&&/^[A-Za-z0-9_-]+$/.test(id);}
  var teamIds={};
  if(!state.teams.every(function(team){
    if(!team||!validId(team.id)||teamIds[team.id]||typeof team.name!=="string"||!Array.isArray(team.players)||
      (team.periods!==undefined&&team.periods!==null&&(!Number.isInteger(team.periods)||team.periods<1||team.periods>8)))return false;
    teamIds[team.id]=true;
    var playerIds={};
    return team.players.every(function(player){
      if(!player||!validId(player.id)||playerIds[player.id]||typeof player.num!=="string"||typeof player.name!=="string"||(player.alias!==undefined&&typeof player.alias!=="string"))return false;
      playerIds[player.id]=true;return true;
    });
  }))return false;
  return state.activeTeam===null||state.activeTeam===undefined||teamIds[state.activeTeam]===true;
}
function importBackup(file){
  return file.text().then(function(text){
    var data;
    try{data=JSON.parse(text);}catch(e){alert("El archivo no contiene un JSON válido.");return;}
    if(!validBackupData(data)){
      alert("El archivo no contiene un respaldo completo compatible o tiene datos no válidos.");
      return;
    }
    if(!confirm("El respaldo va a sustituir el partido, los jugadores, todos los equipos guardados y los ajustes de este dispositivo. Los datos actuales harán las maletas y se irán al banquillo. ¿Continuar?"))return;
    if(!confirm("Última llamada: al aceptar, se borrará todo lo actual y se pondrá el respaldo en su lugar. ¿Seguro que quieres hacer el cambio?"))return;
    applyLoaded(data.state);
    S.theme=data.state.theme;
    setTheme(S.theme);
    S.view="main";S.picker=null;S.editTeamId=null;S.summaryPeriods=null;
    save();render();
    alert("Respaldo importado correctamente.");
  },function(){alert("No se pudo leer el archivo seleccionado.");});
}
function exportTeam(teamId){
  var team=findTeam(teamId);if(!team)return;
  var data={format:"basket-stats-teams",version:1,team:{
    name:team.name,periods:team.periods,players:team.players.map(function(p){return {num:p.num,name:p.name,alias:p.alias||""};})
  }};
  var filename=team.name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"equipo";
  return saveFile("plantilla-"+filename+"-"+today().iso+".json",JSON.stringify(data,null,2),"application/json;charset=utf-8");
}
function importTeams(file){
  return file.text().then(function(text){
    var data;
    try{data=JSON.parse(text);}catch(e){alert("El archivo no contiene un JSON válido.");return;}
    if(!data||data.format!=="basket-stats-teams"||data.version!==1){
      alert("El archivo no tiene un formato de plantillas compatible.");
      return;
    }
    var teams=Array.isArray(data.teams)?data.teams:(data.team?[data.team]:null);
    if(!teams){
      alert("El archivo no tiene un formato de plantilla compatible.");
      return;
    }
    var imported=[];
    for(var i=0;i<teams.length;i++){
      var team=teams[i];
      if(!team||typeof team.name!=="string"||!team.name.trim()||!Array.isArray(team.players)||
        (team.periods!==undefined&&team.periods!==null&&(!Number.isInteger(team.periods)||team.periods<1||team.periods>8))){
        alert("El equipo "+(i+1)+" no es válido. No se ha importado ningún equipo.");
        return;
      }
      var players=[];
      for(var j=0;j<team.players.length;j++){
        var player=team.players[j];
        if(!player||typeof player.num!=="string"||typeof player.name!=="string"||(player.alias!==undefined&&typeof player.alias!=="string")){
          alert("El jugador "+(j+1)+" del equipo «"+team.name+"» no es válido. No se ha importado ningún equipo.");
          return;
        }
        players.push({id:uid(),num:player.num,name:player.name,alias:typeof player.alias==="string"?player.alias.slice(0,MAX_ALIAS_LENGTH):""});
      }
      imported.push({id:uid(),name:team.name.trim(),periods:team.periods==null?null:team.periods,players:players});
    }
    if(!imported.length){alert("El archivo no contiene equipos para importar.");return;}
    var question=imported.length===1?"Se añadirá el equipo seleccionado a las plantillas guardadas.":"Se añadirán "+imported.length+" equipos a las plantillas guardadas.";
    if(!confirm(question+" Las plantillas existentes no se modificarán. ¿Continuar?"))return;
    S.teams=S.teams.concat(imported);save();render();
    alert("Se ha"+(imported.length===1?" importado 1 equipo.":"n importado "+imported.length+" equipos."));
  }).catch(function(){alert("No se pudo leer el archivo seleccionado.");});
}

var app=document.getElementById("app"),tooltipNode=null,actionOrderDrag=null;
app.addEventListener("pointerdown",function(e){
  var handle=e.target.closest(".drag-handle");
  if(!handle||!e.isPrimary||e.button!==0)return;
  var row=handle.closest("[data-order-row]");
  if(!row)return;
  e.preventDefault();
  handle.setPointerCapture(e.pointerId);
  actionOrderDrag={handle:handle,row:row,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,moved:false};
});
app.addEventListener("pointermove",function(e){
  var drag=actionOrderDrag;
  if(!drag||drag.pointerId!==e.pointerId)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<4)return;
  drag.moved=true;
  drag.row.classList.add("dragging");
  var target=document.elementFromPoint(e.clientX,e.clientY);
  target=target&&target.closest("[data-order-row]");
  if(!target||target===drag.row||target.parentElement!==drag.row.parentElement)return;
  var rect=target.getBoundingClientRect();
  target.parentElement.insertBefore(drag.row,e.clientY<rect.top+rect.height/2?target:target.nextSibling);
});
app.addEventListener("pointerup",function(e){
  var drag=actionOrderDrag;
  if(!drag||drag.pointerId!==e.pointerId)return;
  actionOrderDrag=null;
  drag.row.classList.remove("dragging");
  if(drag.handle.hasPointerCapture(e.pointerId))drag.handle.releasePointerCapture(e.pointerId);
  if(drag.moved){
    setActionOrderFromRows(drag.row.parentElement);
    var settingsScroll=drag.row.closest(".pg").scrollTop;
    save();render();
    document.querySelector(".pg").scrollTop=settingsScroll;
  }
});
app.addEventListener("pointercancel",function(e){
  if(!actionOrderDrag||actionOrderDrag.pointerId!==e.pointerId)return;
  actionOrderDrag=null;
  render();
});
function showActionTip(button){
  if(!button||!button.dataset.tip)return;
  if(!tooltipNode){
    tooltipNode=document.createElement("div");
    tooltipNode.className="action-tip";
    tooltipNode.setAttribute("role","tooltip");
    document.body.appendChild(tooltipNode);
  }
  tooltipNode.textContent=button.dataset.tip;
  tooltipNode.style.display="block";
  var r=button.getBoundingClientRect(),t=tooltipNode.getBoundingClientRect();
  var left=r.left+(r.width-t.width)/2;
  left=Math.max(8,Math.min(left,window.innerWidth-t.width-8));
  var top=r.top-t.height-7;
  if(top<8)top=r.bottom+7;
  top=Math.max(8,Math.min(top,window.innerHeight-t.height-8));
  tooltipNode.style.left=left+"px";
  tooltipNode.style.top=top+"px";
  button.setAttribute("aria-describedby","action-tip");
  tooltipNode.id="action-tip";
}
function hideActionTip(button){
  if(tooltipNode)tooltipNode.style.display="none";
  if(button)button.removeAttribute("aria-describedby");
}
app.addEventListener("pointerover",function(e){
  var button=e.target.closest(".iconbtn");
  if(button)showActionTip(button);
});
app.addEventListener("pointerout",function(e){
  var button=e.target.closest(".iconbtn");
  if(button&&(!e.relatedTarget||!button.contains(e.relatedTarget)))hideActionTip(button);
});
app.addEventListener("focusin",function(e){showActionTip(e.target.closest(".iconbtn"));});
app.addEventListener("focusout",function(e){hideActionTip(e.target.closest(".iconbtn"));});
window.addEventListener("scroll",function(){hideActionTip();},true);
window.addEventListener("resize",function(){hideActionTip();});
app.addEventListener("click",function(e){

  var b=e.target.closest("button");if(!b)return;
  var d=b.dataset;
  if(d.timeout){
    if(d.timeout!=="us"&&d.timeout!=="rival")return;
    S.events.push({id:uid(),side:d.timeout,p:null,a:"tm",q:S.period});
    save();flash("✔ Tiempo muerto · "+(d.timeout==="us"?S.clubName.trim()||"Nosotros":S.opponentName.trim()||"Rival"));return;
  }
  if(d.summaryPeriod){
    var n=+d.summaryPeriod,selected=selectedSummaryPeriods();
    S.summaryPeriods=selected.indexOf(n)===-1?selected.concat([n]):selected.filter(function(period){return period!==n;});
    render();return;
  }
  if(d.summaryVisibility){
    S.summaryHideInactive=!S.summaryHideInactive;
    render();return;
  }
  if(d.teamPeriodCount){
    var teamPeriodParts=d.teamPeriodCount.split("|"),presetTeam=findTeam(teamPeriodParts[0]),presetCount=Number(teamPeriodParts[1]);
    if(presetTeam&&[1,4,6].indexOf(presetCount)!==-1){presetTeam.periods=presetCount;S.customTeamPeriodInput=false;save();render();}
    return;
  }
  if(d.teamPeriodCustom){
    S.customTeamPeriodInput=true;render();
    var customPeriodInput=document.getElementById("team-period-input-"+d.teamPeriodCustom);
    if(customPeriodInput){customPeriodInput.focus();customPeriodInput.select();}
    return;
  }
  if(d.periodCount){
    S.periods=Number(d.periodCount);
    S.customPeriodInput=false;
    if(S.period>S.periods)S.period=S.periods;
    S.summaryPeriods=null;save();render();return;
  }
  if(d.periodCountCustom!==undefined){
    S.customPeriodInput=true;render();return;
  }
  if(d.a){startAction(d.a);return;}
  if(d.orderAction){moveAction(d.orderAction,Number(d.orderDirection));return;}
  if(d.playeraction){startPlayerAction(d.playeraction);return;}
  if(d.per){S.period=+d.per;save();render();return;}
  if(d.logtoggle){S.logExpanded=!S.logExpanded;render();return;}
  if(d.pks!==undefined){pickTarget(d.pks,d.pkp||null);return;}
  if(d.pkcancel!==undefined){closePicker();return;}
  if(d.pkact!==undefined){pickAction(d.pkact);return;}
  if(d.pkfoul!==undefined){pickFoulType(d.pkfoul);return;}
  if(d.pkperiod!==undefined){
    var selectedPeriod=Number(d.pkperiod);
    if(S.picker&&S.picker.periodEdit&&selectedPeriod>=1&&selectedPeriod<=S.picker.periodCount){
      var periodPicker=S.picker;
      S.picker=null;
      periodPicker.onContinue(selectedPeriod);
    }
    return;
  }
  if(d.edit){startEdit(d.edit);return;}
  if(d.exportteam){exportTeam(d.exportteam);return;}
  if(d.x==="importteams"){document.getElementById("teamsfile").click();return;}
  if(d.x==="importmatch"){document.getElementById("matchfile").click();return;}
  if(d.x==="exportbackup"){exportBackup();return;}
  if(d.x==="importbackup"){document.getElementById("backupfile").click();return;}
  if(d.del){
    var ev=S.events.filter(function(v){return v.id===d.del;})[0];
    if(!ev||!confirm("¿Borrar este registro?"))return;
    if(ev&&ev.pairId)S.events.forEach(function(v){if(v.id!==ev.id&&v.pairId===ev.pairId)delete v.pairId;});
    S.events=S.events.filter(function(v){return v.id!==d.del;});
    save();render();return;
  }
  if(d.delp){
    var n=S.events.filter(function(v){return v.side==="us"&&v.p===d.delp;}).length;
    if(confirm("¿Eliminar este jugador"+(n?" y sus "+n+" acciones registradas":"")+"?")){
      var playersPage=b.closest(".pg"),playersScroll=playersPage?playersPage.scrollTop:0;
      var pageScrollX=window.scrollX,pageScrollY=window.scrollY;
      S.players=S.players.filter(function(p){return p.id!==d.delp;});
      S.events=S.events.filter(function(v){return !(v.side==="us"&&v.p===d.delp);});
      save();render();
      var updatedPlayersPage=document.querySelector(".pg");
      if(updatedPlayersPage)updatedPlayersPage.scrollTop=playersScroll;
      window.scrollTo(pageScrollX,pageScrollY);
    }
    return;
  }
  if(b.id==="xcsv"){exportCsv();return;}
  if(b.id==="xpdf"){exportPdf();return;}
  if(b.id==="exportmatch"){exportMatch();return;}
  if(d.theme){setTheme(d.theme);render();return;}
  if(d.editteam){S.editTeamId=d.editteam;S.customTeamPeriodInput=false;S.view="team";render();return;}
  if(d.loadteam){
    var lt=findTeam(d.loadteam);if(!lt)return;
    if(!confirm('¿Cargar el equipo "'+lt.name+'"? Sustituye a los jugadores actuales y empieza un partido nuevo (se borra el registro).'))return;
    S.players=sortPlayersList(lt.players.map(function(p){return {id:uid(),num:p.num,name:p.name,alias:p.alias||""};}));
    if(Number.isInteger(lt.periods)){S.periods=lt.periods;S.customPeriodInput=false;}
    S.events=[];S.period=1;S.summaryPeriods=null;S.activeTeam=lt.id;S.view="main";save();render();return;
  }
  if(d.delteam){
    var dt=findTeam(d.delteam);if(!dt)return;
    if(!confirm('¿Eliminar el equipo "'+dt.name+'"? Esto no afecta al partido actual.'))return;
    S.teams=S.teams.filter(function(t){return t.id!==d.delteam;});
    if(S.activeTeam===d.delteam)S.activeTeam=null;
    save();render();return;
  }
  if(d.taddp){
    var tm=findTeam(d.taddp);
    if(tm){
      var addedPlayer={id:uid(),num:"",name:"",alias:""};
      tm.players.push(addedPlayer);tm.players=sortPlayersList(tm.players);save();render();
      var addedNumber=document.getElementById("team-player-num-"+tm.id+"-"+addedPlayer.id);
      if(addedNumber)addedNumber.focus();
    }
    return;
  }
  if(d.tdelp){
    var parts=d.tdelp.split("|"),tm2=findTeam(parts[0]);
    if(tm2){
      if(confirm("¿Eliminar a este jugador de la plantilla?")){
        var teamPlayersScroll=b.closest(".pg").scrollTop;

        save();render();
        document.querySelector(".pg").scrollTop=teamPlayersScroll;
      }
    }
    return;
  }
  var x=d.x;if(!x)return;

  else if(x==="fin"){S.summaryHideInactive=false;S.view="sum";}
  else if(x==="back")S.view="main";
  else if(x==="back2set")S.view="set";
  else if(x==="back2teams")S.view="teams";
  else if(x==="backteams")S.view=S.teamsReturnView||"main";
  else if(x==="teams"){S.teamsReturnView=S.view;S.view="teams";}
  else if(x==="add"){
    var addedMatchPlayer={id:uid(),num:"",name:"",alias:""};
    S.players.push(addedMatchPlayer);save();render();
    var addedMatchNumber=document.getElementById("match-player-num-"+addedMatchPlayer.id);
    if(addedMatchNumber)addedMatchNumber.focus();
    return;
  }
  else if(x==="blank"){
    if(!confirm("¿Sustituir los jugadores actuales por una plantilla en blanco (12 dorsales sin nombre)? Se borrará el registro del partido."))return;
    S.players=blankRoster();S.events=[];S.period=1;S.summaryPeriods=null;S.activeTeam=null;save();
  }
  else if(x==="newteam"){
    var nn=prompt("Nombre del nuevo equipo:");if(nn===null)return;nn=nn.trim();if(!nn)return;
    var nt={id:uid(),name:nn,players:sortPlayersList(blankRoster())};S.teams.push(nt);save();
    S.editTeamId=nt.id;S.view="team";
  }
  else if(x==="saveteam"){
    var sn=prompt("Guardar la plantilla actual como equipo. Nombre:");if(sn===null)return;sn=sn.trim();if(!sn)return;
    var newTeam={id:uid(),name:sn,players:sortPlayersList(S.players.map(function(p){return {id:uid(),num:p.num,name:p.name,alias:p.alias||""};}))};
    S.teams.push(newTeam);S.activeTeam=newTeam.id;save();
  }
  else if(x==="resetsettings"){
    if(!confirm("¿Restablecer todas las opciones de la aplicación? Se conservarán el registro actual, los jugadores y los equipos guardados."))return;
    if(!confirm("Confirmación final: los colores, el orden de las acciones, las opciones activadas y los ajustes del partido volverán a sus valores predeterminados. Los equipos guardados no se borrarán. ¿Continuar?"))return;
    resetSettings();return;
  }
  else if(x==="new"){
    if(!confirm("¿Empezar un nuevo partido? Se borrará todo el registro (jugadores y ajustes se mantienen)."))return;
    S.events=[];S.period=1;S.summaryPeriods=null;S.view="main";save();
  }
  render();
});
document.getElementById("app").addEventListener("change",function(e){

    var file=t.files&&t.files[0];t.value="";

    return;
  }
  if(t.id==="matchfile"){
    var matchFile=t.files&&t.files[0];t.value="";
    if(matchFile)importMatch(matchFile);
    return;
  }
  if(t.id==="backupfile"){
    var backupFile=t.files&&t.files[0];t.value="";
    if(backupFile)importBackup(backupFile);
    return;
  }
  if(t.dataset.grp){S.enabled[t.dataset.grp]=t.checked?1:0;save();return;}
  if(t.dataset.actionColor){
    if(COLOR_OPTIONS.some(function(option){return option.id===t.value;})){
      S.actionColors[t.dataset.actionColor]=t.value;save();
    }
    return;
  }
  if(t.id==="playerActionMode"){S.playerActionMode=t.checked;save();return;}
  if(t.id==="askReboundAfterMiss"){S.askReboundAfterMiss=t.checked;save();return;}
  if(t.id==="home"){S.home=t.checked;save();return;}
  if(t.id==="customPeriodCount"){
    var v=Number(t.value);
    if(!Number.isInteger(v)||v<1||v>8){t.value=S.periods;return;}
    S.periods=v;if(S.period>v)S.period=v;S.summaryPeriods=null;save();
    return;
  }
  if(t.dataset.teamPeriodInput){
    var teamPeriods=Number(t.value),periodsTeam=findTeam(t.dataset.teamPeriodInput);
    if(!Number.isInteger(teamPeriods)||teamPeriods<1||teamPeriods>8){t.value=periodsTeam&&periodsTeam.periods?periodsTeam.periods:4;return;}
    if(periodsTeam){
      periodsTeam.periods=teamPeriods;
      if([1,4,6].indexOf(teamPeriods)!==-1)S.customTeamPeriodInput=false;
      save();render();
    }
  }
});
